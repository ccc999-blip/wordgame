      currentTotal: 0,
      pieStats: {},
      logs: [],
      piggyRemaining: 0,
      piggyLogs: [],
      cycleSummaries: []
    };

    let historyStack = [];
    let historyPointer = -1;

    let currentTab = 'overview';
    let currentMode = '支出';
    let pieChartInstance = null;
    let selectedPresetIndex = null;

    let currentEditingType = 'category';
    let tempModalItems = [];
    let tempPresets = [];
    let editingPresetIdx = -1;

    // 搜尋狀態（錢包 & 存錢筒）
    let walletSearchState = { active: false, query: '', tab: '支出' };
    let piggySearchState = { active: false, query: '', tab: '支出' };

    // 統計頁狀態
    let statsState = {
      ledger: 'wallet',   // 'wallet' | 'piggy' | 'all'
      range: 'cycle',     // 'cycle' | '30d' | '6m' | 'all'
      rankMode: 'category'// 'category' | 'payment'
    };
    let statsDetailState = {
      open: false,
      rankName: '',
      sortField: 'date',
      sortDir: 'desc'
    };

    // 計算機狀態
    let calcInput = '';
    let calcLastFormula = '';
    let unlockBelowTimer = null;

    const TAB_TITLES = {
      overview: { zh: '概覽', en: 'Overview' },
      record:   { zh: '記帳', en: 'Record' },
      history:  { zh: '紀錄', en: 'History' },
      stats:    { zh: '統計', en: 'Stats' }
    };

    const EARTH_PALETTE = [
      '#8C4A32', // 古銅深褐
      '#C89D54', // 芥末暖黃
      '#385E4C', // 霧面墨綠
      '#4A6B82', // 灰霧藍
      '#7E6551', // 暖胡桃棕
      '#8C7A6B', // 亞麻灰褐
      '#5C6B5E', // 鼠尾草綠
      '#9E5847'  // 赤陶紅
    ];

    const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

    let appDialogCallback = null;
    function showAppAlert(msg, title = '提示') {
      document.getElementById('app-dialog-title').textContent = title;
      document.getElementById('app-dialog-msg').textContent = msg;
      document.getElementById('app-dialog-cancel').style.display = 'none';
      document.getElementById('app-dialog-ok').textContent = '確定';
      appDialogCallback = null;
      document.getElementById('app-dialog-modal').classList.add('active');
    }
    function showAppConfirm(msg, onConfirm, title = '確認') {
      document.getElementById('app-dialog-title').textContent = title;
      document.getElementById('app-dialog-msg').textContent = msg;
      document.getElementById('app-dialog-cancel').style.display = 'block';
      document.getElementById('app-dialog-ok').textContent = '確定';
      appDialogCallback = onConfirm;
      document.getElementById('app-dialog-modal').classList.add('active');
    }
    function closeAppDialog(confirmed) {
      document.getElementById('app-dialog-modal').classList.remove('active');
      const cb = appDialogCallback;
      appDialogCallback = null;
      if (confirmed && typeof cb === 'function') cb();
    }

    // ========= 日期與時間工具函式 =========
    function getTodayDateKey() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    function getTodayIsoDate() {
      return getTodayDateKey().replace(/\//g, '-');
    }

    function getNowTimePart() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${hh}:${min}`;
    }

    function getNowFormattedString() {
      return `${getTodayDateKey()} ${getNowTimePart()}`;
    }

    function parseDateKeyToObj(dayKey) {
      const parts = String(dayKey || '').split('/');
      if (parts.length !== 3) return null;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return isNaN(dt.getTime()) ? null : dt;
    }

    function formatObjToDateKey(dt) {
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    function getWeekdayFromDatePart(datePart) {
      if (!datePart) return '';
      const dt = parseDateKeyToObj(datePart);
      if (!dt) return '';
      return WEEKDAY_NAMES[dt.getDay()];
    }

    function formatDateWithWeekday(dateStr) {
      const s = String(dateStr || '').trim();
      if (!s) return '';
      const [datePart, timePart] = s.split(' ');
      const wd = getWeekdayFromDatePart(datePart);
      if (!wd) return s;
      return timePart ? `${datePart} (${wd}) ${timePart}` : `${datePart} (${wd})`;
    }

    function formatDayOnlyWithWeekday(datePart) {
      const wd = getWeekdayFromDatePart(datePart);
      return wd ? `${datePart} (${wd})` : datePart;
    }

    // ========= 日期選擇器互動邏輯 =========
    function setRecordDateToToday() {
      const input = document.getElementById('input-record-date');
      input.value = getTodayIsoDate();
      updateDateDisplayUI();
    }

    function handleDateInputChange() {
      const input = document.getElementById('input-record-date');
      if (!input.value) {
        input.value = getTodayIsoDate();
      }
      updateDateDisplayUI();
    }

    function updateDateDisplayUI() {
      const input = document.getElementById('input-record-date');
      const rawIso = input.value || getTodayIsoDate();
      const slashDate = rawIso.replace(/-/g, '/');
      const todayKey = getTodayDateKey();

      document.getElementById('record-date-display').textContent = formatDayOnlyWithWeekday(slashDate);
      const badge = document.getElementById('record-date-badge');
      if (slashDate === todayKey) {
        badge.textContent = '今日';
        badge.className = 'date-today-tag';
      } else {
        badge.textContent = '補記';
        badge.className = 'date-past-tag';
      }
    }

    // ========= 5×4 計算機鍵盤邏輯 =========
    function openCalcKeyboard() {
      const kb = document.getElementById('calc-keyboard');
      const amountBox = document.getElementById('amount-box');
      amountBox.classList.add('calc-open');
      kb.classList.add('active');
      updateCalcDisplay();
    }

    function closeCalcKeyboard() {
      const kb = document.getElementById('calc-keyboard');
      const amountBox = document.getElementById('amount-box');
      if (!kb.classList.contains('active')) return;
      kb.classList.remove('active');
      amountBox.classList.remove('calc-open');
      updateCalcDisplay();
    }

    document.addEventListener('pointerdown', function(e) {
      const kb = document.getElementById('calc-keyboard');
      if (!kb || !kb.classList.contains('active')) return;
      if (kb.contains(e.target)) return;
      const amountBox = document.getElementById('amount-box');
      if (amountBox && amountBox.contains(e.target)) return;
      const modeSwitch = document.querySelector('#page-record .mode-switch');
      if (modeSwitch && modeSwitch.contains(e.target)) return;
      closeCalcKeyboard();
    }, true);

    function hasPendingOperator(str) {
      return /[+\-×÷]/.test(String(str || ''));
    }

    function computeExpressionValue(expr) {
      if (!expr) return 0;
      let clean = String(expr)
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-');
      clean = clean.replace(/[+\-*/.]+$/, '');
      if (!clean) return 0;
      if (!/^[0-9+\-*/.() ]+$/.test(clean)) return 0;
      try {
        const val = Function('"use strict"; return (' + clean + ')')();
        if (typeof val === 'number' && isFinite(val)) {
          return Math.max(0, Math.round(val));
        }
      } catch (e) {}
      return 0;
    }

    function evaluateCurrentExpression() {
      if (!calcInput) return 0;
      const cleanExpr = String(calcInput).replace(/[+\-×÷.]+$/, '');
      const val = computeExpressionValue(cleanExpr);
      if (hasPendingOperator(cleanExpr)) {
        calcLastFormula = cleanExpr + ' =';
      }
      calcInput = val > 0 ? String(val) : '';
      return val;
    }

    function formatCalcInputForDisplay(raw) {
      if (!raw) return '0';
      return String(raw).replace(/\d+(\.\d+)?/g, function(numStr) {
        const parts = numStr.split('.');
        const intFormatted = Number(parts[0]).toLocaleString();
        return parts.length > 1 ? `${intFormatted}.${parts[1]}` : intFormatted;
      });
    }

    function updateCalcDisplay() {
      const previewEl = document.getElementById('calc-expr-preview');
      const displayEl = document.getElementById('amount-display-val');
      const doneEqBtn = document.getElementById('btn-calc-done-eq');

      previewEl.textContent = calcLastFormula || '';

      if (!calcInput) {
        displayEl.textContent = '0';
        displayEl.classList.add('placeholder');
        displayEl.classList.remove('long-expr');
      } else {
        const formatted = formatCalcInputForDisplay(calcInput);
        displayEl.textContent = formatted;
        displayEl.classList.remove('placeholder');
        if (formatted.length > 11) {
          displayEl.classList.add('long-expr');
        } else {
          displayEl.classList.remove('long-expr');
        }
      }

      if (doneEqBtn) {
        const isReadyToEqual = hasPendingOperator(calcInput) && /\d$/.test(calcInput);
        doneEqBtn.textContent = isReadyToEqual ? '=' : 'OK';
      }
    }

    function handleCalcPad(e, key) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const ops = ['+', '-', '×', '÷'];

      if (key === 'AC') {
        clearPresetSelectionHighlight();
        calcInput = '';
        calcLastFormula = '';
        updateCalcDisplay();
        return;
      }

      if (key === 'BACK') {
        clearPresetSelectionHighlight();
        if (calcInput.length > 0) {
          calcInput = calcInput.slice(0, -1);
        } else {
          calcLastFormula = '';
        }
        updateCalcDisplay();
        return;
      }

      if (key === 'DONE_EQ') {
        const isReadyToEqual = hasPendingOperator(calcInput) && /\d$/.test(calcInput);
        if (isReadyToEqual) {
          evaluateCurrentExpression();
          updateCalcDisplay();
        } else {
          closeCalcKeyboard();
        }
        return;
      }

      clearPresetSelectionHighlight();

      if (ops.includes(key)) {
        if (!calcInput) return;
        const lastCh = calcInput.slice(-1);
        if (ops.includes(lastCh)) {
          calcInput = calcInput.slice(0, -1) + key;
        } else {
          calcInput += key;
        }
        updateCalcDisplay();
        return;
      }

      if (key === '.') {
        const parts = calcInput.split(/[+\-×÷]/);
        const curNum = parts[parts.length - 1];
        if (!curNum.includes('.')) {
          calcInput += (curNum === '' ? '0.' : '.');
        }
        updateCalcDisplay();
        return;
      }

      if (calcLastFormula && !hasPendingOperator(calcInput)) {
        calcLastFormula = '';
      }
      const parts = calcInput.split(/[+\-×÷]/);
      const curNum = parts[parts.length - 1];

      if (key === '00') {
        if (!curNum || curNum === '0') {
          if (!curNum) calcInput += '0';
        } else if (curNum.replace('.', '').length <= 7) {
          calcInput += '00';
        }
        updateCalcDisplay();
        return;
      }

      if (curNum === '0') {
        calcInput = calcInput.slice(0, -1) + key;
      } else if (curNum.replace('.', '').length < 9) {
        calcInput += key;
      }
      updateCalcDisplay();
    }

    function setAmountFromPreset(amt) {
      calcLastFormula = '';
      calcInput = String(amt);
      updateCalcDisplay();
    }

    // ========= 核心資料重算（錢包 + 存錢筒獨立計算） =========
    function sortAndComputeLogs(logsArray, isPiggy) {
      const totalLen = logsArray.length;
      logsArray.forEach((item, i) => {
        if (!item.id) {
          item.id = (isPiggy ? 'piggy_' : 'log_') + (Date.now() - i) + '_' + i;
        }
        if (typeof item.seq !== 'number') {
          item.seq = totalLen - i;
        }
      });

      logsArray.sort((a, b) => {
        const dayA = String(a.date || '').split(' ')[0];
        const dayB = String(b.date || '').split(' ')[0];
        if (dayA !== dayB) {
          return dayB.localeCompare(dayA);
        }
        return (Number(b.seq) || 0) - (Number(a.seq) || 0);
      });

      const chronological = [...logsArray].reverse();
      let runningRem = 0;
      let runningTot = 0;
      let lastClearIdx = -1;

      chronological.forEach((item, idx) => {
        const amt = Math.abs(Number(item.amount) || 0);
        item.amount = amt;
        if (item.type === '清空') {
          runningRem = 0;
          runningTot = 0;
          item.categoryOrNote = item.categoryOrNote || '執行清存';
          item.payment = '';
          item.memo = '';
          lastClearIdx = idx;
        } else if (item.type === '收入') {
          runningTot += amt;
          runningRem += amt;
          item.payment = '';
          item.memo = '';
        } else if (item.type === '支出') {
          runningRem -= amt;
        }
        item.remaining = runningRem;
        item.total = runningTot;
      });

      return {
        sortedLogs: chronological.reverse(),
        runningRem,
        runningTot,
        lastClearIdx,
        chronological
      };
    }

    function recalculateState() {
      if (!Array.isArray(appState.categories) || appState.categories.length === 0) {
        appState.categories = ['餐飲', '娛樂（遊戲）', '娛樂（其他）', '網路'];
      }
      if (!appState.categories.includes('餐飲')) {
        appState.categories.unshift('餐飲');
      }
      if (!Array.isArray(appState.payments) || appState.payments.length === 0) {
        appState.payments = ['現金', '悠遊卡', '行動支付', '銀行帳戶'];
      }
      if (!appState.payments.includes('現金')) {
        appState.payments.unshift('現金');
      }
      if (!Array.isArray(appState.presets)) {
        appState.presets = [];
      }
      if (!Array.isArray(appState.logs)) {
        appState.logs = [];
      }
      if (!Array.isArray(appState.piggyLogs)) {
        appState.piggyLogs = [];
      }
      if (!Array.isArray(appState.cycleSummaries)) {
        appState.cycleSummaries = [];
      }

      // 錢包重算（同步動態重建 cycleSummaries 週期歸檔，確保刪除紀錄／刪除清存／上一步皆完全一致）
      const walletRes = sortAndComputeLogs(appState.logs, false);
      appState.currentRemaining = walletRes.runningRem;
      appState.currentTotal = walletRes.runningTot;

      const rebuiltCycles = [];
      let cStart = '', cEnd = '', cBudget = 0, cExpense = 0, cRem = 0;
      walletRes.chronological.forEach(item => {
        if (item.type === '清空') {
          const settledDay = String(item.date || '').split(' ')[0] || '';
          rebuiltCycles.push({
            id: item.cycleId || ('cycle_' + item.id),
            startDate: cStart || settledDay,
            endDate: cEnd || settledDay,
            totalBudget: cBudget,
            totalExpense: cExpense,
            remaining: cRem,
            settledAt: item.date || ''
          });
          cStart = '';
          cEnd = '';
          cBudget = 0;
          cExpense = 0;
          cRem = 0;
        } else {
          const dk = String(item.date || '').split(' ')[0] || '';
          const amt = Math.abs(Number(item.amount) || 0);
          if (dk) {
            if (!cStart || dk < cStart) cStart = dk;
            if (!cEnd || dk > cEnd) cEnd = dk;
          }
          if (item.type === '收入') {
            cBudget += amt;
            cRem += amt;
          } else if (item.type === '支出') {
            cExpense += amt;
            cRem -= amt;
          }
        }
      });
      appState.cycleSummaries = rebuiltCycles.reverse();

      const pieStats = {};
      for (let i = walletRes.lastClearIdx + 1; i < walletRes.chronological.length; i++) {
        const item = walletRes.chronological[i];
        if (item.type === '支出') {
          const rawCat = String(item.categoryOrNote || '未分類');
          const baseCat = rawCat.split('（')[0] || '未分類';
          pieStats[baseCat] = (pieStats[baseCat] || 0) + (Number(item.amount) || 0);
        }
      }
      appState.pieStats = pieStats;
      appState.logs = walletRes.sortedLogs;

      // 存錢筒重算
      const piggyRes = sortAndComputeLogs(appState.piggyLogs, true);
      appState.piggyRemaining = piggyRes.runningRem;
      appState.piggyLogs = piggyRes.sortedLogs;
    }

    function calculateTodaySpend() {
      const todayPrefix = getTodayDateKey();
      let sum = 0;
      const logs = appState.logs || [];
      for (let i = 0; i < logs.length; i++) {
        const item = logs[i];
        if (item.type === '清空') {
          break;
        }
        if (item.type === '支出' && String(item.date || '').startsWith(todayPrefix)) {
          sum += Number(item.amount) || 0;
        }
      }
      return sum;
    }

    function getNextSeqNumber(targetList) {
      const list = targetList || appState.logs || [];
      let maxSeq = 0;
      list.forEach(item => {
        if (typeof item.seq === 'number' && item.seq > maxSeq) {
          maxSeq = item.seq;
        }
      });
      return maxSeq + 1;
    }

    function createSnapshotObject(viewContext = null) {
      const snap = JSON.parse(JSON.stringify({
        categories: appState.categories,
        payments: appState.payments,
        presets: appState.presets,
        logs: appState.logs,
        piggyLogs: appState.piggyLogs,
        cycleSummaries: appState.cycleSummaries
      }));
      if (viewContext) {
        snap.viewContext = JSON.parse(JSON.stringify(viewContext));
      }
      return snap;
    }

    function applySnapshotObject(snap) {
      if (!snap) return;
      appState.categories = JSON.parse(JSON.stringify(snap.categories || ['餐飲', '娛樂（遊戲）', '娛樂（其他）', '網路']));
      appState.payments = JSON.parse(JSON.stringify(snap.payments || ['現金', '悠遊卡', '行動支付', '銀行帳戶']));
      appState.presets = JSON.parse(JSON.stringify(snap.presets || []));
      appState.logs = JSON.parse(JSON.stringify(snap.logs || []));
      appState.piggyLogs = JSON.parse(JSON.stringify(snap.piggyLogs || []));
      appState.cycleSummaries = JSON.parse(JSON.stringify(snap.cycleSummaries || []));
      recalculateState();
    }

    function persistToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          categories: appState.categories,
          payments: appState.payments,
          presets: appState.presets,
          logs: appState.logs,
          piggyLogs: appState.piggyLogs,
          cycleSummaries: appState.cycleSummaries
        }));
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify({
          stack: historyStack,
          pointer: historyPointer
        }));
      } catch (e) {
        console.error('寫入 LocalStorage 失敗:', e);
      }
    }

    function pushHistoryStep(viewContext = null) {
      const snap = createSnapshotObject(viewContext);
      if (historyPointer < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyPointer + 1);
      }
      historyStack.push(snap);
      if (historyStack.length > MAX_HISTORY_STEPS) {
        historyStack.shift();
      }
      historyPointer = historyStack.length - 1;
      persistToLocalStorage();
      updateUndoRedoButtonsUI();
    }

    function commitChangeWithVersion(viewContext = null) {
      recalculateState();
      pushHistoryStep(viewContext);
    }

    function handleUndoStep() {
      if (historyPointer <= 0) return;
      historyPointer--;
      const snap = historyStack[historyPointer];
      applySnapshotObject(snap);
      persistToLocalStorage();
      applyViewContextFromSnapshot(snap);
    }

    function handleRedoStep() {
      if (historyPointer >= historyStack.length - 1) return;
      historyPointer++;
      const snap = historyStack[historyPointer];
      applySnapshotObject(snap);
      persistToLocalStorage();
      applyViewContextFromSnapshot(snap);
    }

    function updateUndoRedoButtonsUI() {
      const btnUndo = document.getElementById('btn-undo-step');
      const btnRedo = document.getElementById('btn-redo-step');
      if (btnUndo) btnUndo.disabled = (historyPointer <= 0);
      if (btnRedo) btnRedo.disabled = (historyPointer >= historyStack.length - 1);
    }

    function loadStateFromLocal() {
      try {
        const rawHist = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (rawHist) {
          const parsedHist = JSON.parse(rawHist);
          if (parsedHist && Array.isArray(parsedHist.stack) && parsedHist.stack.length > 0) {
            historyStack = parsedHist.stack;
            historyPointer = typeof parsedHist.pointer === 'number'
              ? Math.min(Math.max(0, parsedHist.pointer), historyStack.length - 1)
              : historyStack.length - 1;
            applySnapshotObject(historyStack[historyPointer]);
            updateUndoRedoButtonsUI();
            return;
          }
        }

        const rawState = localStorage.getItem(STORAGE_KEY);
        if (rawState) {
          const parsed = JSON.parse(rawState);
          if (parsed && typeof parsed === 'object') {
            appState.categories = Array.isArray(parsed.categories) ? parsed.categories : appState.categories;
            appState.payments = Array.isArray(parsed.payments) ? parsed.payments : appState.payments;
            appState.presets = Array.isArray(parsed.presets) ? parsed.presets : [];
            appState.logs = Array.isArray(parsed.logs) ? parsed.logs : [];
            appState.piggyLogs = Array.isArray(parsed.piggyLogs) ? parsed.piggyLogs : [];
            appState.cycleSummaries = Array.isArray(parsed.cycleSummaries) ? parsed.cycleSummaries : [];
          }
        }
        recalculateState();
      } catch (e) {
        console.error('讀取 LocalStorage 失敗:', e);
      }

      historyStack = [createSnapshotObject()];
      historyPointer = 0;
      persistToLocalStorage();
      updateUndoRedoButtonsUI();
    }

    function handleImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          const source = (parsed && parsed.data && Array.isArray(parsed.data.logs)) ? parsed.data : parsed;

          if (!source || !Array.isArray(source.logs)) {
            showAppAlert('匯入失敗：此檔案格式不正確，找不到記帳紀錄資料。');
            return;
          }

          const logCount = source.logs.length + (Array.isArray(source.piggyLogs) ? source.piggyLogs.length : 0);
          showAppConfirm(
            `確定要匯入「${file.name}」嗎？\n` +
            `（內含 ${logCount} 筆紀錄，匯入後將覆蓋目前的分類、常用選項與所有記帳資料）`,
            () => {
              appState.categories = Array.isArray(source.categories) && source.categories.length > 0
                ? source.categories
                : ['餐飲', '娛樂（遊戲）', '娛樂（其他）', '網路'];
              appState.payments = Array.isArray(source.payments) && source.payments.length > 0
                ? source.payments
                : ['現金', '悠遊卡', '行動支付', '銀行帳戶'];
              appState.presets = Array.isArray(source.presets) ? source.presets : [];
              appState.logs = source.logs;
              appState.piggyLogs = Array.isArray(source.piggyLogs) ? source.piggyLogs : [];
              appState.cycleSummaries = Array.isArray(source.cycleSummaries) ? source.cycleSummaries : [];

              selectedPresetIndex = null;

              if (parsed && parsed.versionHistory && Array.isArray(parsed.versionHistory.stack) && parsed.versionHistory.stack.length > 0) {
                historyStack = parsed.versionHistory.stack;
                historyPointer = typeof parsed.versionHistory.pointer === 'number'
                  ? Math.min(Math.max(0, parsed.versionHistory.pointer), historyStack.length - 1)
                  : historyStack.length - 1;
                applySnapshotObject(historyStack[historyPointer]);
                persistToLocalStorage();
                updateUndoRedoButtonsUI();
              } else {
                commitChangeWithVersion();
              }

              renderAll();
              showAppAlert('已成功匯入並還原存檔狀態！');
            }
          );
        } catch (err) {
          showAppAlert('匯入失敗：無法解析檔案內容，請確認選擇的是正確的 .json 備份檔。');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function attachEdgeSwipeBack(modalEl, onCloseFn) {
      if (!modalEl) return;
      let startX = 0, startY = 0, dx = 0, isEdge = false, isHoriz = null;

      modalEl.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (t.clientX <= 48) {
          isEdge = true;
          startX = t.clientX;
          startY = t.clientY;
          dx = 0;
          isHoriz = null;
          modalEl.style.transition = 'none';
        } else {
          isEdge = false;
        }
      }, { passive: true });

      modalEl.addEventListener('touchmove', function(e) {
        if (!isEdge || !e.touches || e.touches.length !== 1) return;
        const curX = e.touches[0].clientX - startX;
        const curY = e.touches[0].clientY - startY;
        if (isHoriz === null) {
          if (Math.abs(curX) > 6 || Math.abs(curY) > 6) {
            isHoriz = (curX > 0 && Math.abs(curX) > Math.abs(curY));
            if (!isHoriz) {
              isEdge = false;
              return;
            }
          }
        }
        if (!isHoriz) return;
        if (e.cancelable) e.preventDefault();
        dx = Math.max(0, curX);
        modalEl.style.transform = `translateX(${dx}px)`;
      }, { passive: false });

      modalEl.addEventListener('touchend', function() {
        if (!isEdge) return;
        isEdge = false;
        modalEl.style.transition = 'transform 0.28s cubic-bezier(0.32, 0.72, 0, 1)';
        const threshold = Math.min(110, (window.innerWidth || 360) * 0.28);
        if (dx > threshold) {
          modalEl.style.transform = 'translateX(100%)';
          setTimeout(() => {
            modalEl.style.transition = 'none';
            modalEl.style.transform = '';
            onCloseFn();
          }, 260);
        } else {
          modalEl.style.transform = 'translateX(0px)';
          setTimeout(() => {
            modalEl.style.transition = 'none';
            modalEl.style.transform = '';
          }, 280);
        }
      });
    }

    function switchTab(tabName, btnEl, skipScrollTop = false) {
      const prevTab = currentTab;
      currentTab = tabName;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + tabName).classList.add('active');
      if (btnEl) btnEl.classList.add('active');

      if (TAB_TITLES[tabName]) {
        document.getElementById('header-title-zh').textContent = TAB_TITLES[tabName].zh;
        document.getElementById('header-title-en').textContent = TAB_TITLES[tabName].en;
      }

      if (tabName !== 'record') {
        closeCalcKeyboard();
      }
      if (prevTab === 'history' && tabName !== 'history') {
        walletSearchState.active = false;
        resetSearchBarInput('wallet');
      }

      if (tabName === 'record' && prevTab !== 'record') {
        resetRecordFormOnEnter();
      } else if (tabName === 'overview') {
        renderOverview();
      } else if (tabName === 'history') {
        renderHistory();
      } else if (tabName === 'stats') {
        renderStatsPage();
      }

      updateTopRightActionButtons();
      syncAllStatsSliders();
      if (!skipScrollTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });

    // ========= 每日支出總覽 Bottom Sheet =========
    function renderDailySpendSheetContent() {
      const listEl = document.getElementById('daily-sheet-list');
      listEl.innerHTML = '';

      const logs = appState.logs || [];
      if (logs.length === 0) {
        listEl.innerHTML = '<div class="empty-hint" style="padding:32px 0;">尚無任何支出紀錄</div>';
        return;
      }

      const groups = [];
      let currentDayGroup = null;

      logs.forEach(item => {
        if (item.type === '清空') {
          if (currentDayGroup) {
            groups.push(currentDayGroup);
            currentDayGroup = null;
          }
          groups.push({ isClear: true, date: item.date });
          return;
        }

        if (item.type === '支出') {
          const dayKey = String(item.date || '').split(' ')[0] || '未知日期';
          if (!currentDayGroup || currentDayGroup.dayKey !== dayKey) {
            if (currentDayGroup) groups.push(currentDayGroup);
            currentDayGroup = { isClear: false, dayKey: dayKey, total: 0 };
          }
          currentDayGroup.total += Number(item.amount) || 0;
        }
      });
      if (currentDayGroup) groups.push(currentDayGroup);

      const hasAnyExpense = groups.some(g => !g.isClear);
      if (!hasAnyExpense) {
        listEl.innerHTML = '<div class="empty-hint" style="padding:32px 0;">尚無任何支出紀錄</div>';
        return;
      }

      groups.forEach(g => {
        const div = document.createElement('div');
        if (g.isClear) {
          div.className = 'daily-sheet-clear';
          div.innerHTML = `
            <span>執行清存</span>
            <span>${formatDateWithWeekday(g.date)}</span>
          `;
        } else {
          const wd = getWeekdayFromDatePart(g.dayKey);
          div.className = 'daily-sheet-row';
          div.innerHTML = `
            <div class="daily-sheet-date">
              <span>${g.dayKey}</span>
              <span class="daily-sheet-weekday">星期${wd}</span>
            </div>
            <div class="daily-sheet-amt">-${g.total.toLocaleString()} 元</div>
          `;
        }
        listEl.appendChild(div);
      });
    }

    // ========= 存錢筒全螢幕視窗開關（以撲滿圖標為中心放大展開／縮小收回） =========
    let piggyOrigin = { x: 260, y: 180 };
    let piggyCloseTimer = null;

    function getPiggyIconCenter() {
      const iconEl = document.querySelector('.piggy-bank-icon') || document.querySelector('.piggy-bank-btn');
      if (iconEl) {
        const rect = iconEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          piggyOrigin = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2
          };
        }
      }
      return piggyOrigin;
    }

    function openPiggyBankModal() {
      if (piggyCloseTimer) {
        clearTimeout(piggyCloseTimer);
        piggyCloseTimer = null;
      }
      piggySearchState.active = false;
      document.getElementById('piggy-search-input').value = '';
      toggleSearchClearBtn('piggy');
      renderPiggyHistory();

      const modal = document.getElementById('piggy-modal');
      const origin = getPiggyIconCenter();

      modal.style.transition = 'none';
      modal.style.transformOrigin = `${origin.x}px ${origin.y}px`;
      modal.style.transform = 'scale(0.08)';
      modal.style.borderRadius = '999px';
      modal.style.opacity = '0';
      modal.classList.add('active');

      void modal.offsetHeight;

      modal.style.transition = 'transform 0.56s cubic-bezier(0.32, 0.72, 0, 1), border-radius 0.56s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.32s ease';

      modal.style.opacity = '1';

      setTimeout(() => {
        if (modal.classList.contains('active')) {

          modal.style.borderRadius = '';
        }

    function closePiggyBankModal(immediate = false) {

    // ========= 渲染概覽頁 =========
    function renderOverview() {
      const rem = Number(appState.currentRemaining || 0);
      const tot = Number(appState.currentTotal || 0);
      const piggyRem = Number(appState.piggyRemaining || 0);

      const remEl = document.getElementById('overview-rem');
      const totEl = document.getElementById('overview-tot');
      remEl.textContent = rem.toLocaleString() + ' 元';
      totEl.textContent = tot.toLocaleString() + ' 元';
      if (rem < 0) {
        remEl.classList.add('negative');
      } else {
        remEl.classList.remove('negative');
      }

      const piggyValEl = document.getElementById('overview-piggy-val');
      if (piggyValEl) {
        piggyValEl.textContent = piggyRem.toLocaleString() + ' 元';
        if (piggyRem < 0) {
          piggyValEl.classList.add('negative');
        } else {
          piggyValEl.classList.remove('negative');
        }
      }

      const todaySpend = calculateTodaySpend();
      document.getElementById('overview-today').textContent = todaySpend.toLocaleString() + ' 元';

      const pieStats = appState.pieStats || {};
      const entries = Object.entries(pieStats)
        .map(([cat, amt]) => ({ cat, amt: Number(amt) || 0 }))
        .filter(item => item.amt > 0)
        .sort((a, b) => b.amt - a.amt);

      const totalSpent = entries.reduce((acc, cur) => acc + cur.amt, 0);

      document.getElementById('burn-spent-val').textContent = `${totalSpent.toLocaleString()} 元`;
      document.getElementById('burn-budget-val').textContent = `${tot.toLocaleString()} 元`;

      const mainTrackEl = document.getElementById('main-progress-track');
      let rawMainPct = 0;
      if (tot > 0) {
        rawMainPct = (totalSpent / tot) * 100;
      } else if (totalSpent > 0) {
        rawMainPct = 100;
      }
      const barWidthMainPct = Math.min(100, rawMainPct);
      const displayMainPct = Math.round(rawMainPct);
      const isOverBudget = (tot > 0 && totalSpent > tot);
      const mainFillClass = isOverBudget ? 'thick-bar-fill over-budget' : 'thick-bar-fill';

      if (totalSpent === 0) {
        mainTrackEl.innerHTML = `
          <div class="${mainFillClass}" style="width: 0%;"></div>
          <span class="bar-label-outside" style="color: var(--muted);">0%</span>
        `;
      } else if (barWidthMainPct >= 16) {
        mainTrackEl.innerHTML = `
          <div class="${mainFillClass}" style="width: ${barWidthMainPct}%;">
            <span class="bar-label-inside">${displayMainPct}%</span>
          </div>
        `;
      } else {
        mainTrackEl.innerHTML = `
          <div class="${mainFillClass}" style="width: ${barWidthMainPct}%;"></div>
          <span class="bar-label-outside">${displayMainPct}%</span>
        `;
      }

      const pieContainer = document.getElementById('pie-container');
      const canvas = document.getElementById('pieChart');
      const emptyEl = document.getElementById('chart-empty');

      if (entries.length === 0 || typeof Chart === 'undefined') {
        pieContainer.style.display = 'none';
        emptyEl.style.display = 'block';
        if (pieChartInstance) {
          pieChartInstance.destroy();
          pieChartInstance = null;
        }
        return;
      }

      pieContainer.style.display = 'flex';
      emptyEl.style.display = 'none';

      if (pieChartInstance) {
        pieChartInstance.destroy();
        pieChartInstance = null;
      }

      const rawLabels = entries.map(e => e.cat);
      const values = entries.map(e => e.amt);
      const fullLabels = entries.map(e => {
        const pct = totalSpent > 0 ? Math.round((e.amt / totalSpent) * 100) : 0;
        return `${e.cat} ${e.amt.toLocaleString()}元 (${pct}%)`;
      });

      const alwaysShowSliceLabelPlugin = {
        id: 'alwaysShowSliceLabel',
        afterDatasetsDraw(chart) {
          const { ctx } = chart;
          const meta = chart.getDatasetMeta(0);
          if (!meta || !meta.data) return;

          ctx.save();
          ctx.fillStyle = '#FDFCF9';
          ctx.font = '600 11px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          meta.data.forEach((arc, index) => {
            const val = values[index];
            const pct = totalSpent > 0 ? Math.round((val / totalSpent) * 100) : 0;
            if (pct < 6) return;

            const pos = arc.tooltipPosition();
            const catName = rawLabels[index];
            ctx.fillText(`${catName} ${pct}%`, pos.x, pos.y - 6);
            ctx.fillText(`${val.toLocaleString()}元`, pos.x, pos.y + 7);
          });
          ctx.restore();
        }
      };

      pieChartInstance = new Chart(canvas, {
        type: 'pie',
        data: {
          labels: fullLabels,
          datasets: [{
            data: values,
            backgroundColor: EARTH_PALETTE,
            borderWidth: 1.5,
            borderColor: '#FDFCF9'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: 4
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: '#2C2C2A',
              titleColor: '#FDFCF9',
              bodyColor: '#FDFCF9',
              callbacks: {
                label: function(ctx) {
                  return ctx.label;
                }
              }
            }
          }
        },
        plugins: [alwaysShowSliceLabelPlugin]
      });
    }

    function selectPresetOnRecordPage(idx) {
      const preset = appState.presets[idx];
      if (!preset) return;

      if (selectedPresetIndex === idx) {
        selectedPresetIndex = null;
        calcInput = '';
        calcLastFormula = '';
        updateCalcDisplay();

        const catSelect = document.getElementById('select-category');
        if ([...catSelect.options].some(o => o.value === '餐飲')) {
          catSelect.value = '餐飲';
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
        const srcSelect = document.getElementById('select-expense-source');
        if (srcSelect) srcSelect.value = '錢包';
        const paySelect = document.getElementById('select-payment');
        if (paySelect) {
          if ([...paySelect.options].some(o => o.value === '現金')) {
            paySelect.value = '現金';
          } else if (paySelect.options.length > 0) {
            paySelect.selectedIndex = 0;
          }
        }
        const memoInput = document.getElementById('input-expense-memo');
        if (memoInput) memoInput.value = '';
        renderPresetsSelectList();
        return;
      }

      selectedPresetIndex = idx;
      setAmountFromPreset(preset.amount);

      const catSelect = document.getElementById('select-category');
      if ([...catSelect.options].some(o => o.value === preset.category)) {
        catSelect.value = preset.category;
      }

      const srcSelect = document.getElementById('select-expense-source');
      if (srcSelect) {
        srcSelect.value = preset.source || '錢包';
      }

      const paySelect = document.getElementById('select-payment');
      if (paySelect) {
        const targetPay = preset.payment || '現金';
        if ([...paySelect.options].some(o => o.value === targetPay)) {
          paySelect.value = targetPay;
        } else if (paySelect.options.length > 0) {
          paySelect.selectedIndex = 0;
        }
      }

      const memoInput = document.getElementById('input-expense-memo');
      if (memoInput) {
        memoInput.value = preset.memo !== undefined ? preset.memo : (preset.name || '');
      }

      renderPresetsSelectList();
    }

        renderPresetsSelectList();
      }

    // ========= 新增、清存（含週期歷史快照歸檔）、左滑刪除 =========
    function submitRecord() {
      closeCalcKeyboard();
      const amount = Math.abs(Number(computeExpressionValue(calcInput)) || 0);
      if (!amount || amount <= 0) {
        showAppAlert('請輸入大於 0 的金額');
        return;
      }

      const dateInputVal = document.getElementById('input-record-date').value || getTodayIsoDate();
      const selectedSlashDate = dateInputVal.replace(/-/g, '/');
      const todaySlashDate = getTodayDateKey();

      const finalDateStr = (selectedSlashDate === todaySlashDate)
        ? `${selectedSlashDate} ${getNowTimePart()}`
        : selectedSlashDate;

      const isExpense = (currentMode === '支出');
      const targetAccount = isExpense
        ? document.getElementById('select-expense-source').value
        : document.getElementById('select-income-target').value;
      const isPiggy = (targetAccount === '存錢筒');
      const targetLogs = isPiggy ? appState.piggyLogs : appState.logs;

      const newLog = {
        id: (isPiggy ? 'piggy_' : 'log_') + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        seq: getNextSeqNumber(targetLogs),
        date: finalDateStr,
        type: currentMode,
        amount: amount,
        categoryOrNote: '',
        payment: '',
        remaining: 0,
        total: 0,
        memo: ''
      };

      if (isExpense) {
        const selectedCat = document.getElementById('select-category').value;
        const customMemo = document.getElementById('input-expense-memo').value.trim();
        newLog.categoryOrNote = selectedCat;
        newLog.payment = document.getElementById('select-payment').value;

        if (selectedPresetIndex !== null && appState.presets[selectedPresetIndex]) {
          const presetName = appState.presets[selectedPresetIndex].name;
          if (!customMemo || customMemo === presetName) {
            newLog.memo = presetName;
          } else {
            newLog.memo = customMemo;
          }
        } else {
          newLog.memo = customMemo;
        }
      } else {
        newLog.categoryOrNote = document.getElementById('input-note').value.trim() || '收入';
      }

      targetLogs.unshift(newLog);
      commitChangeWithVersion();
      renderAll();
      resetRecordFormOnEnter();
      switchTab('overview', document.querySelectorAll('.nav-tab')[0]);
    }

    function buildCurrentCycleSummary(nowStr) {
      const currentCycleLogs = [];
      for (let i = 0; i < (appState.logs || []).length; i++) {
        const item = appState.logs[i];
        if (item.type === '清空') break;
        currentCycleLogs.push(item);
      }

      let totalExpense = 0;
      let startDate = nowStr.split(' ')[0];
      const endDate = nowStr.split(' ')[0];

      if (currentCycleLogs.length > 0) {
        const dates = currentCycleLogs
          .map(item => String(item.date || '').split(' ')[0])
          .filter(Boolean)
          .sort();
        if (dates.length > 0) startDate = dates[0];
        currentCycleLogs.forEach(item => {
          if (item.type === '支出') {
            totalExpense += Number(item.amount) || 0;
          }
        });
      }

      return {
        id: 'cycle_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        startDate: startDate,
        endDate: endDate,
        totalBudget: Number(appState.currentTotal || 0),
        totalExpense: totalExpense,
        remaining: Number(appState.currentRemaining || 0),
        settledAt: nowStr
      };
    }

    function handleClear() {
      recalculateState();
      const rem = Number(appState.currentRemaining || 0);
      let confirmMsg = '';
      if (rem > 0) {
        confirmMsg = `確定要執行清存嗎？\n將把本輪剩餘「${rem.toLocaleString()} 元」存入存錢筒（註記：剩錢存入），同時歸檔本輪週期摘要並將錢包歸零重新計算。`;
      } else if (rem < 0) {
        confirmMsg = `確定要執行清存嗎？\n本輪透支「${Math.abs(rem).toLocaleString()} 元」，將從存錢筒扣款（註記：透支存錢），同時歸檔本輪週期摘要並將錢包歸零重新計算。`;
      } else {
        confirmMsg = '確定要執行清存嗎？\n目前可用餘額為 0 元，將歸檔本輪週期摘要並把錢包歸零重新計算。';
      }

      showAppConfirm(
        confirmMsg,
        () => {
          closeCalcKeyboard();
          const nowStr = getNowFormattedString();

          const cycleId = 'cycle_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

          if (rem > 0) {
            appState.piggyLogs.unshift({
              id: 'piggy_' + Date.now() + '_settle',
              seq: getNextSeqNumber(appState.piggyLogs),
              date: nowStr,
              type: '收入',
              amount: rem,
              categoryOrNote: '剩錢存入',
              payment: '',
              remaining: 0,
              total: 0,
              memo: ''
            });
          } else if (rem < 0) {
            appState.piggyLogs.unshift({
              id: 'piggy_' + Date.now() + '_settle',
              seq: getNextSeqNumber(appState.piggyLogs),
              date: nowStr,
              type: '支出',
              amount: Math.abs(rem),
              categoryOrNote: '透支存錢',
              payment: '錢包結算',
              remaining: 0,
              total: 0,
              memo: ''
            });

    function parseExpenseDisplay(item) {
      let rawCat = String(item.categoryOrNote || '');
      let baseCat = rawCat;
      let presetNote = '';

      const match = rawCat.match(/^(.+?)（(.+)）$/);
      if (match) {
        baseCat = match[1];
        presetNote = match[2];
      }

      let extraMemo = String(item.memo || '').trim();
      let combinedNote = '';
      if (presetNote && extraMemo && presetNote !== extraMemo) {
        combinedNote = `${presetNote}・${extraMemo}`;
      } else {
        combinedNote = presetNote || extraMemo;
      }

      return { baseCat, combinedNote };
    }

    // ========= 紀錄頁搜尋比對邏輯 =========
    function matchSearchQuery(item, rawQuery) {
      if (!item || item.type === '清空') return false;
      const q = String(rawQuery || '').trim();
      if (!q) return false;

      const datePart = String(item.date || '').split(' ')[0] || '';
      const dateSegments = datePart.split('/');
      const monthNum = dateSegments.length >= 2 ? Number(dateSegments[1]) : NaN;
      const dayNum = dateSegments.length >= 3 ? Number(dateSegments[2]) : NaN;
      const amtStr = String(Math.abs(Number(item.amount) || 0));

      const yuanMatch = q.match(/^(\d+)元$/);
      if (yuanMatch) {
        return amtStr.includes(yuanMatch[1]);
      }

      const monthMatch = q.match(/^(\d{1,2})月$/);
      if (monthMatch) {
        return !isNaN(monthNum) && monthNum === Number(monthMatch[1]);
      }

      const dayMatch = q.match(/^(\d{1,2})[日號]$/);
      if (dayMatch) {
        return !isNaN(dayNum) && dayNum === Number(dayMatch[1]);
      }

      if (/^\d+$/.test(q)) {
        return amtStr.includes(q) || datePart.includes(q);
      }

      const qLower = q.toLowerCase();
      const fields = [
        item.categoryOrNote || '',
        item.memo || '',
        item.payment || ''
      ];
      return fields.some(f => String(f).toLowerCase().includes(qLower));
    }

    // ========= 紀錄頁左滑刪除手勢綁定 =========
    let currentOpenSwipeWrapper = null;

    function closeAnyOpenSwipeItem(exceptWrapper) {
      if (currentOpenSwipeWrapper && currentOpenSwipeWrapper !== exceptWrapper) {
        const fg = currentOpenSwipeWrapper.querySelector('.log-item');
        if (fg) fg.style.transform = 'translateX(0px)';
        currentOpenSwipeWrapper.classList.remove('open', 'swiping');
        currentOpenSwipeWrapper = null;

    function attachSwipeHandler(wrapper, fgEl, logId, deleteFn, onTapFn) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let baseOffset = 0;
      let isDragging = false;
      let isHorizontal = null;
      let moved = false;

      fgEl.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        closeAnyOpenSwipeItem(wrapper);
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        baseOffset = wrapper.classList.contains('open') ? -78 : 0;
        currentX = baseOffset;
        isDragging = true;
        isHorizontal = null;
        moved = false;
        fgEl.style.transition = 'none';
      }, { passive: true });

      fgEl.addEventListener('touchmove', function(e) {
        if (!isDragging || !e.touches || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;

        if (isHorizontal === null) {
          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
            isHorizontal = Math.abs(dx) > Math.abs(dy);
          }
        }
        if (!isHorizontal) return;

        if (e.cancelable) e.preventDefault();
        wrapper.classList.add('swiping');
        currentX = Math.min(0, baseOffset + dx);
        fgEl.style.transform = `translateX(${currentX}px)`;
      }, { passive: false });

      fgEl.addEventListener('touchend', function() {
        if (!isDragging) return;
        isDragging = false;
        fgEl.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
        const fullWidth = wrapper.offsetWidth || 320;

        if (currentX < -fullWidth * 0.45) {
          fgEl.style.transform = `translateX(-${fullWidth}px)`;
          setTimeout(() => {
            deleteFn(logId);
          }, 160);
        } else if (currentX < -38) {
          fgEl.style.transform = 'translateX(-78px)';
          wrapper.classList.add('open');
          wrapper.classList.remove('swiping');
          currentOpenSwipeWrapper = wrapper;
        } else {
          fgEl.style.transform = 'translateX(0px)';
          wrapper.classList.remove('open', 'swiping');
          if (currentOpenSwipeWrapper === wrapper) currentOpenSwipeWrapper = null;
        }
      });

      if (typeof onTapFn === 'function') {
        fgEl.addEventListener('click', function() {
          if (wrapper.classList.contains('open') || moved) return;
          onTapFn(logId);
        });
      }
    }

    function buildLogItemContent(item) {
      const formattedFullDate = formatDateWithWeekday(item.date);
      const div = document.createElement('div');
      div.className = 'log-item';

      if (item.type === '收入') {

          </div>
        `;
      } else {
        const { baseCat, combinedNote } = parseExpenseDisplay(item);
        const noteSpanHtml = combinedNote
          ? `<span class="log-note-inline">${combinedNote}</span>`
          : '';
        const badgeHtml = item.payment ? `<span class="badge-pay">${item.payment}</span>` : '';

        div.innerHTML = `
          <div class="log-left">
            <div class="log-title">
              <span class="log-cat-name">${baseCat}</span>
              ${badgeHtml}
              ${noteSpanHtml}
            </div>
            <div class="log-date">${formattedFullDate}</div>
          </div>
          <div class="log-right">
            <div class="log-amt expense">-${item.amount.toLocaleString()} 元</div>
            <div class="log-rem">餘額 ${item.remaining.toLocaleString()} 元</div>
          </div>
        `;
      }
      return div;
    }

    function renderLogListInto(listEl, logs, deleteFn, emptyText) {
      listEl.innerHTML = '';
      currentOpenSwipeWrapper = null;

      if (!logs || logs.length === 0) {
        listEl.innerHTML = `<div class="empty-hint">${emptyText}</div>`;
        return;
      }

      const todayKey = getTodayDateKey();
      const blocks = [];
      let currentBlock = null;

      logs.forEach(item => {
        if (item.type === '清空') {
          if (currentBlock) {
            blocks.push(currentBlock);
            currentBlock = null;
          }
          blocks.push({ isClear: true, item: item });
          return;
        }

        const dayKey = String(item.date || '').split(' ')[0] || '';
        if (!currentBlock || currentBlock.dayKey !== dayKey) {
          if (currentBlock) blocks.push(currentBlock);
          currentBlock = {
            isClear: false,
            dayKey: dayKey,
            expenseSum: 0,
            items: []
          };
        }
        if (item.type === '支出') {
          currentBlock.expenseSum += Number(item.amount) || 0;
        }
        currentBlock.items.push(item);
      });
      if (currentBlock) blocks.push(currentBlock);

      let lastAppendedWrapper = null;

      blocks.forEach(block => {
        if (block.isClear) {
          if (lastAppendedWrapper) {
            lastAppendedWrapper.classList.add('no-bottom-border');
          }
          const wrapper = document.createElement('div');
          wrapper.className = 'swipe-item-wrapper clear-wrapper';
          wrapper.setAttribute('data-log-id', block.item.id);

          const delBg = document.createElement('div');
          delBg.className = 'swipe-delete-bg';
          delBg.textContent = '刪除';
          delBg.onclick = () => deleteFn(block.item.id);

          const div = document.createElement('div');
          div.className = 'log-item clear-event';
          div.innerHTML = `
            <span style="font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.5px;">執行清存</span>
            <span class="log-date">${formatDateWithWeekday(block.item.date)}</span>
          `;

          wrapper.appendChild(delBg);
          wrapper.appendChild(div);
          attachSwipeHandler(wrapper, div, block.item.id, deleteFn, null);
          listEl.appendChild(wrapper);
          lastAppendedWrapper = null;
          return;
        }

        const isDayFinished = (block.dayKey && block.dayKey < todayKey);
        if (isDayFinished) {
          if (lastAppendedWrapper) {
            lastAppendedWrapper.classList.add('no-bottom-border');
          }
          const divider = document.createElement('div');
          divider.className = 'day-summary-divider';
          divider.innerHTML = `
            <div class="day-summary-line"></div>
            <div class="day-summary-pill">
              ${formatDayOnlyWithWeekday(block.dayKey)} 支出 <b>${block.expenseSum.toLocaleString()} 元</b>
            </div>
            <div class="day-summary-line"></div>
          `;
          listEl.appendChild(divider);
        }

        block.items.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.className = 'swipe-item-wrapper';
          wrapper.setAttribute('data-log-id', item.id);
          wrapper.setAttribute('data-log-day', String(item.date || '').split(' ')[0] || '');
          wrapper.setAttribute('data-log-type', item.type || '');

          const delBg = document.createElement('div');
          delBg.className = 'swipe-delete-bg';
          delBg.textContent = '刪除';
          delBg.onclick = () => deleteFn(item.id);

          const div = buildLogItemContent(item);

          wrapper.appendChild(delBg);
          wrapper.appendChild(div);
          attachSwipeHandler(wrapper, div, item.id, deleteFn, null);
          listEl.appendChild(wrapper);
          lastAppendedWrapper = wrapper;
        });
      });
    }
