    function getStatsDateWindow(ledger, range, validLogs) {
      const todayKey = getTodayDateKey();
      const todayDt = parseDateKeyToObj(todayKey);
      let startDt = new Date(todayDt);

      if (range === '7d') {
        startDt.setDate(todayDt.getDate() - 6);
        return { startDate: formatObjToDateKey(startDt), endDate: todayKey, totalDays: 7 };
      }
      if (range === '30d') {
        startDt.setDate(todayDt.getDate() - 29);
        return { startDate: formatObjToDateKey(startDt), endDate: todayKey, totalDays: 30 };
      }
      if (range === '6m') {
        startDt = new Date(todayDt.getFullYear(), todayDt.getMonth() - 5, 1);
        const diff = Math.round((todayDt - startDt) / 86400000) + 1;
        return { startDate: formatObjToDateKey(startDt), endDate: todayKey, totalDays: Math.max(1, diff) };
      }
      if (range === 'cycle') {
        const lastClear = (appState.logs || []).find(x => x.type === '清空' || x.type === 'clear');
        if (lastClear && lastClear.date) {
          const clearDay = String(lastClear.date).split(' ')[0];
          const cDt = parseDateKeyToObj(clearDay);
          if (cDt) {
            const diff = Math.round((todayDt - cDt) / 86400000) + 1;
            return { startDate: clearDay, endDate: todayKey, totalDays: Math.max(1, diff) };
          }
        }
      }

      // 全部（或尚未清存時的本輪）：取所選帳本最早有效紀錄日期
      const dates = (validLogs || []).map(x => String(x.date || '').split(' ')[0]).filter(Boolean).sort();
      if (dates.length > 0) {
        const eDt = parseDateKeyToObj(dates[0]);
        if (eDt && eDt <= todayDt) {
          const diff = Math.round((todayDt - eDt) / 86400000) + 1;
          return { startDate: dates[0], endDate: todayKey, totalDays: Math.max(1, diff) };
        }
      }
      return { startDate: todayKey, endDate: todayKey, totalDays: 1 };
    }

    function getFilteredStatsData() {
      let rawPool = [];
      if (statsState.ledger === 'wallet') {
        const base = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
        rawPool = base.map(item => ({ ...item, _ledger: '錢包' }));
      } else if (statsState.ledger === 'piggy') {
        rawPool = (appState.piggyLogs || []).map(item => ({ ...item, _ledger: '存錢筒' }));
      } else {
        const wBase = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
        const wLogs = wBase.map(item => ({ ...item, _ledger: '錢包' }));
        const pLogs = (appState.piggyLogs || [])
          .filter(item => !isInternalClearTransfer(item))
          .map(item => ({ ...item, _ledger: '存錢筒' }));
        rawPool = wLogs.concat(pLogs);
      }

      // 排除系統標記（清空/clear）與 excludeStats === true
      const validPool = rawPool.filter(item =>
        (item.type === '支出' || item.type === '收入') && item.excludeStats !== true
      );

      const win = getStatsDateWindow(statsState.ledger, statsState.range, validPool);
      const logs = validPool.filter(item => {
        const dk = String(item.date || '').split(' ')[0];
        return dk && dk >= win.startDate && dk <= win.endDate;
      });

      return { logs, window: win };
    }

    function getFilteredStatsLogs() {
      return getFilteredStatsData().logs;
    }

    function renderStatsPage() {
      const { logs, window: win } = getFilteredStatsData();
      renderStatsKPIs(logs, win);
      renderStatsRankCard(logs);
      renderStatsTrendChart(logs, win);
      syncAllStatsSliders();
    }

    function renderStatsKPIs(logs, win) {
      let totalExp = 0;
      let totalInc = 0;
      const daySpendMap = {};

      logs.forEach(item => {
        const dayKey = String(item.date || '').split(' ')[0];
        const amt = Math.abs(Number(item.amount) || 0);
        if (item.type === '支出') {
          totalExp += amt;
          if (dayKey) daySpendMap[dayKey] = (daySpendMap[dayKey] || 0) + amt;
        } else if (item.type === '收入') {
          totalInc += amt;
        }
      });

      const totalDays = Math.max(1, win.totalDays || 1);
      const avgDaily = Math.round(totalExp / totalDays);
      document.getElementById('kpi-avg-spend').textContent = `${avgDaily.toLocaleString()} 元`;
      document.getElementById('kpi-avg-sub').textContent = `${totalDays} 天區間`;

      let peakAmt = 0;
      let peakDate = '';
      Object.entries(daySpendMap).forEach(([dk, val]) => {
        if (val > peakAmt || (val === peakAmt && val > 0 && dk > peakDate)) {
          peakAmt = val;
          peakDate = dk;
        }
      });

      currentPeakDayInfo = { amount: peakAmt, date: peakDate, ledger: statsState.ledger };
      const peakCard = document.getElementById('kpi-peak-card');
      if (peakCard) {
        peakCard.classList.toggle('clickable', peakAmt > 0);
      }
      document.getElementById('kpi-peak-spend').textContent = `${peakAmt.toLocaleString()} 元`;
      document.getElementById('kpi-peak-date').textContent = peakDate ? peakDate.slice(5) : '尚無資料';

      const net = totalInc - totalExp;
      const rateEl = document.getElementById('kpi-save-rate');
      if (totalInc <= 0) {
        rateEl.textContent = '—';
        rateEl.className = 'stats-kpi-val ' + (net < 0 ? 'expense' : '');
      } else {
        const pct = Math.round((net / totalInc) * 100);
        rateEl.textContent = `${pct}%`;
        rateEl.className = 'stats-kpi-val ' + (pct >= 0 ? 'income' : 'expense');
      }
      document.getElementById('kpi-net-sub').textContent = `淨額 ${net >= 0 ? '+' : ''}${net.toLocaleString()} 元`;
    }

    function jumpToPeakSpendDay() {
      if (!currentPeakDayInfo || currentPeakDayInfo.amount <= 0 || !currentPeakDayInfo.date) return;
      const targetDate = currentPeakDayInfo.date;

      const walletPool = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
      const walletDayItems = walletPool.filter(item =>
        item.type === '支出' && item.excludeStats !== true && String(item.date || '').split(' ')[0] === targetDate
      );
      const piggyDayItems = (appState.piggyLogs || []).filter(item =>
        item.type === '支出' && item.excludeStats !== true &&
        (statsState.ledger !== 'all' || !isInternalClearTransfer(item)) &&
        String(item.date || '').split(' ')[0] === targetDate
      );

      let goPiggy = false;
      if (statsState.ledger === 'piggy') {
        goPiggy = true;
      } else if (statsState.ledger === 'all') {
        const wSum = walletDayItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const pSum = piggyDayItems.reduce((s, x) => s + (Number(x.amount) || 0), 0);
        if (pSum > wSum) goPiggy = true;
      }

      if (goPiggy) {
        const targetLog = piggyDayItems[0];
        if (!targetLog) return;
        openPiggyBankModal();
        const scrollBox = document.getElementById('piggy-scroll-body');
        setTimeout(() => {
          scrollToAndHighlightLog('piggy-log-list', targetLog.id, scrollBox, targetDate);
        }, 60);
        return;
      }

      const walletMatch = walletDayItems[0];
      if (!walletMatch) return;

      const statsMainCtx = {
        mode: 'stats_main',
        ledger: statsState.ledger,
        range: statsState.range,
        rankMode: statsState.rankMode,
        scrollTop: window.scrollY || 0
      };
      const curSnap = historyStack[historyPointer];
      if (curSnap && curSnap.viewContext && curSnap.viewContext.mode === 'stats_main') {
        curSnap.viewContext = statsMainCtx;
        if (historyPointer < historyStack.length - 1) {
          historyStack = historyStack.slice(0, historyPointer + 1);
        }
      } else {
        pushHistoryStep(statsMainCtx);
      }
      pushHistoryStep({ mode: 'history', highlightLogId: walletMatch.id, highlightDate: targetDate });

      walletSearchState.active = false;
      resetSearchBarInput('wallet');
      switchTab('history', document.querySelectorAll('.nav-tab')[2], true);
      setTimeout(() => {
        scrollToAndHighlightLog('log-list', walletMatch.id, null, targetDate);
      }, 90);
    }

    // 圖表 2：每日／每月收支趨勢長條圖（補齊區間所有日／月 + 固定高度均線）
    let currentTrendBuckets = [];
    let activeTrendBucketIdx = null;
    function renderStatsTrendChart(logs, win) {
      const wrap = document.getElementById('stats-trend-svg-wrap');
      const detail = document.getElementById('stats-trend-detail');
      detail.classList.remove('active', 'clickable');
      detail.removeAttribute('onclick');
      detail.innerHTML = '';
      activeTrendBucketIdx = null;

      const useMonthly = (statsState.range === '6m') || (statsState.range === 'all' && win.totalDays > 45);
      document.getElementById('trend-card-title').textContent = useMonthly
        ? '每月收支趨勢'
        : '每日收支趨勢';

      const bucketMap = {};
      if (useMonthly) {
        const sDt = parseDateKeyToObj(win.startDate);
        const eDt = parseDateKeyToObj(win.endDate);
        if (sDt && eDt) {
          const cur = new Date(sDt.getFullYear(), sDt.getMonth(), 1);
          const endM = new Date(eDt.getFullYear(), eDt.getMonth(), 1);
          while (cur <= endM) {
            const mKey = `${cur.getFullYear()}/${String(cur.getMonth() + 1).padStart(2, '0')}`;
            bucketMap[mKey] = { key: mKey, inc: 0, exp: 0 };
            cur.setMonth(cur.getMonth() + 1);
          }
        }
      } else {
        const sDt = parseDateKeyToObj(win.startDate);
        const eDt = parseDateKeyToObj(win.endDate);
        if (sDt && eDt) {
          const cur = new Date(sDt);
          while (cur <= eDt) {
            const dKey = formatObjToDateKey(cur);
            bucketMap[dKey] = { key: dKey, inc: 0, exp: 0 };
            cur.setDate(cur.getDate() + 1);
          }
        }
      }

      let totalExp = 0;
      logs.forEach(item => {
        const dayKey = String(item.date || '').split(' ')[0];
        if (!dayKey) return;
        const key = useMonthly ? dayKey.slice(0, 7) : dayKey;
        if (!bucketMap[key]) bucketMap[key] = { key, inc: 0, exp: 0 };
        const amt = Math.abs(Number(item.amount) || 0);
        if (item.type === '收入') bucketMap[key].inc += amt;
        else if (item.type === '支出') {
          bucketMap[key].exp += amt;
          totalExp += amt;
        }
      });

      const buckets = Object.values(bucketMap).sort((a, b) => a.key.localeCompare(b.key));
      currentTrendBuckets = buckets;

      if (buckets.length === 0) {
        wrap.innerHTML = '<div class="empty-hint" style="padding:18px 0;">此區間尚無收支資料</div>';
        return;
      }

      const avgExpLine = totalExp / buckets.length;
      const allNonZero = buckets.flatMap(b => [b.inc, b.exp]).filter(v => v > 0).sort((a, b) => a - b);
      const maxActual = Math.max(100, avgExpLine, ...buckets.map(b => Math.max(b.inc, b.exp)));
      let maxVal = maxActual;
      if (allNonZero.length >= 4) {
        const n = allNonZero.length;
        const p25 = allNonZero[Math.floor((n - 1) * 0.25)];
        const p75 = allNonZero[Math.floor((n - 1) * 0.75)];
        const p85 = allNonZero[Math.floor((n - 1) * 0.85)];
        const iqr = Math.max(0, p75 - p25);
        const nonOutlierExp = buckets.map(b => b.exp).filter(v => v > 0 && v <= p75 + 1.5 * iqr);
        const robustAvgExp = nonOutlierExp.length > 0
          ? nonOutlierExp.reduce((s, v) => s + v, 0) / buckets.length
          : avgExpLine;
        const normalCap = Math.max(100, robustAvgExp * 3, p75 * 1.45, Math.min(p85 * 1.2, p75 + 1.5 * iqr));
        if (maxActual > normalCap * 1.15) {
          maxVal = Math.round(normalCap);
        }
      } else if (allNonZero.length >= 2) {
        const secondMax = allNonZero[allNonZero.length - 2];
        if (maxActual > secondMax * 2.2) {
          maxVal = Math.round(Math.max(100, secondMax * 1.3));
        }
      }

      const fmtShort = (v) => v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(v));

      const H = 216;
      const padL = 42, padR = 16, padT = 28, padB = 28;
      const minStep = 46;
      const W = Math.max(400, padL + padR + buckets.length * minStep);
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const step = plotW / buckets.length;
      const barW = Math.max(6, Math.min(14, step * 0.34));

      const avgY = padT + plotH - (Math.min(avgExpLine, maxVal) / maxVal) * plotH;

      let gridHtml = '';
      [0, 0.5, 1].forEach(r => {
        const y = padT + plotH - r * plotH;
        const valLabel = Math.round(maxVal * r);
        const shortLabel = fmtShort(valLabel);
        gridHtml += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#E5E3DC" stroke-width="1"/>`;
        gridHtml += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="#7A7A75" font-family="monospace">${shortLabel}</text>`;
      });

      let barsHtml = '';
      buckets.forEach((b, i) => {
        const cx = padL + step * i + step / 2;
        const incCapped = b.inc > maxVal;
        const expCapped = b.exp > maxVal;
        const incRawH = (Math.min(b.inc, maxVal) / maxVal) * plotH;
        const expRawH = (Math.min(b.exp, maxVal) / maxVal) * plotH;
        const incH = b.inc > 0 ? Math.max(4, incRawH) : 0;
        const expH = b.exp > 0 ? Math.max(4, expRawH) : 0;
        const incY = padT + plotH - incH;
        const expY = padT + plotH - expH;
        const incX = cx - barW - 1;
        const expX = cx + 1;
        const label = useMonthly ? b.key.slice(5) + '月' : b.key.slice(5);

        let capMarks = '';
        let incLabelY = incY - 4;
        let expLabelY = expY - 4;
        if (b.inc > 0 && b.exp > 0 && Math.abs(incLabelY - expLabelY) < 11) {
          if (incLabelY <= expLabelY) {
            incLabelY = Math.min(incLabelY, expLabelY) - 10;
          } else {
            expLabelY = Math.min(incLabelY, expLabelY) - 10;
          }
        }
        if (b.inc > 0) {
          const bx = incX, by = padT;
          if (incCapped) {
            capMarks += `
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 9).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 4).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 14).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 9).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
            `;
          }
          capMarks += `<text x="${(bx + barW / 2).toFixed(1)}" y="${incLabelY.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#385E4C" font-family="monospace">${fmtShort(b.inc)}</text>`;
        }
        if (b.exp > 0) {
          const bx = expX, by = padT;
          if (expCapped) {
            capMarks += `
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 9).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 4).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
              <line x1="${(bx - 1).toFixed(1)}" y1="${(by + 14).toFixed(1)}" x2="${(bx + barW + 1).toFixed(1)}" y2="${(by + 9).toFixed(1)}" stroke="#FDFCF9" stroke-width="2.2"/>
            `;
          }
          capMarks += `<text x="${(bx + barW / 2).toFixed(1)}" y="${expLabelY.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#8C4A32" font-family="monospace">${fmtShort(b.exp)}</text>`;
        }

        barsHtml += `
          <g style="cursor:pointer;" onclick="selectTrendBucket(${i})">
            <rect x="${(padL + step * i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${plotH}" fill="transparent"/>
            <rect x="${incX.toFixed(1)}" y="${incY.toFixed(1)}" width="${barW.toFixed(1)}" height="${incH.toFixed(1)}" rx="2" fill="#385E4C"/>
            <rect x="${expX.toFixed(1)}" y="${expY.toFixed(1)}" width="${barW.toFixed(1)}" height="${expH.toFixed(1)}" rx="2" fill="#8C4A32"/>
            ${capMarks}
            <text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#7A7A75" font-family="monospace">${label}</text>
          </g>
        `;
      });

      let avgLineHtml = '';
      if (avgExpLine > 0) {
        const avgDrawY = Math.min(padT + plotH - 4, Math.max(padT + 2, avgY));
        const avgLabel = `${useMonthly ? '月均' : '日均'} ${fmtShort(avgExpLine)}`;
        const labelW = avgLabel.length * 7.2 + 10;
        const labelX = W - padR - 4;
        const labelY = Math.max(padT + 12, avgDrawY - 5);
        avgLineHtml = `
          <line x1="${padL}" y1="${avgDrawY.toFixed(1)}" x2="${W - padR}" y2="${avgDrawY.toFixed(1)}" stroke="#2C2C2A" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.88"/>
          <rect x="${(labelX - labelW + 2).toFixed(1)}" y="${(labelY - 10).toFixed(1)}" width="${labelW.toFixed(1)}" height="14" rx="3" fill="#FDFCF9" fill-opacity="0.92"/>
          <text x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="600" fill="#2C2C2A" font-family="monospace">${avgLabel}</text>
        `;
      }

      const isScrollable = W > 400;
      wrap.innerHTML = `
        <div class="stats-svg-scroll" id="trend-scroll-box">
          <svg class="stats-svg" style="${isScrollable ? `width:${W}px; max-width:none;` : ''}" viewBox="0 0 ${W} ${H}">
            ${gridHtml}
            ${barsHtml}
            ${avgLineHtml}
          </svg>
        </div>
      `;
      const trendScrollBox = document.getElementById('trend-scroll-box');
      if (trendScrollBox && isScrollable) {
        requestAnimationFrame(() => { trendScrollBox.scrollLeft = trendScrollBox.scrollWidth; });
      }
    }

    function selectTrendBucket(idx) {
      const b = currentTrendBuckets[idx];
      if (!b) return;
      const box = document.getElementById('stats-trend-detail');
      if (activeTrendBucketIdx === idx && box.classList.contains('active')) {
        box.classList.remove('active', 'clickable');
        box.removeAttribute('onclick');
        box.innerHTML = '';
        activeTrendBucketIdx = null;
        return;
      }
      activeTrendBucketIdx = idx;
      const hasLogs = (b.inc > 0 || b.exp > 0);
      const net = b.inc - b.exp;
      box.innerHTML = `
        <div class="stats-detail-head">
          <span>${b.key}${hasLogs ? ' <span style="font-size:10.5px; color:var(--muted); font-weight:500;">· 點擊跳至明細 ›</span>' : ''}</span>
          <span>淨額 ${net >= 0 ? '+' : ''}${net.toLocaleString()} 元</span>
        </div>
        <div style="display:flex; justify-content:space-between; color:var(--muted);">
          <span>收入：<b style="color:var(--income);">+${b.inc.toLocaleString()} 元</b></span>
          <span>支出：<b style="color:var(--expense);">-${b.exp.toLocaleString()} 元</b></span>
        </div>
      `;
      box.classList.add('active');
      if (hasLogs) {
        box.classList.add('clickable');
        box.setAttribute('onclick', 'jumpToActiveTrendBucket()');
      } else {
        box.classList.remove('clickable');
        box.removeAttribute('onclick');
      }
    }

    function jumpToActiveTrendBucket() {
      if (activeTrendBucketIdx === null) return;
      const b = currentTrendBuckets[activeTrendBucketIdx];
      if (!b || (b.inc <= 0 && b.exp <= 0)) return;
      const bucketKey = b.key;
      const isMonthly = bucketKey.length === 7;
      const matchDate = (item) => {
        const dk = String(item.date || '').split(' ')[0];
        return isMonthly ? dk.startsWith(bucketKey) : (dk === bucketKey);
      };

      const walletPool = (statsState.range === 'cycle') ? getCurrentCycleWalletLogs() : (appState.logs || []);
      const walletDayItems = walletPool.filter(item =>
        (item.type === '支出' || item.type === '收入') && item.excludeStats !== true && matchDate(item)
      );
      const piggyDayItems = (appState.piggyLogs || []).filter(item =>
        (item.type === '支出' || item.type === '收入') && item.excludeStats !== true &&
        (statsState.ledger !== 'all' || !isInternalClearTransfer(item)) &&
        matchDate(item)
      );

      let goPiggy = false;
      if (statsState.ledger === 'piggy') {
        goPiggy = true;
      } else if (statsState.ledger === 'all') {
        const wSum = walletDayItems.reduce((s, x) => s + Math.abs(Number(x.amount) || 0), 0);
        const pSum = piggyDayItems.reduce((s, x) => s + Math.abs(Number(x.amount) || 0), 0);
        if (pSum > wSum || (walletDayItems.length === 0 && piggyDayItems.length > 0)) goPiggy = true;
      }

      if (goPiggy) {
        const targetLog = piggyDayItems[0];
        if (!targetLog) return;
        const targetDate = String(targetLog.date || '').split(' ')[0];
        openPiggyBankModal();
        const scrollBox = document.getElementById('piggy-scroll-body');
        setTimeout(() => {
          scrollToAndHighlightLog('piggy-log-list', targetLog.id, scrollBox, targetDate);
        }, 60);
        return;
      }

      const walletMatch = walletDayItems[0];
      if (!walletMatch) return;
      const targetDate = String(walletMatch.date || '').split(' ')[0];

      const statsMainCtx = {
        mode: 'stats_main',
        ledger: statsState.ledger,
        range: statsState.range,
        rankMode: statsState.rankMode,
        scrollTop: window.scrollY || 0
      };
      const curSnap = historyStack[historyPointer];
      if (curSnap && curSnap.viewContext && curSnap.viewContext.mode === 'stats_main') {
        curSnap.viewContext = statsMainCtx;
        if (historyPointer < historyStack.length - 1) {
          historyStack = historyStack.slice(0, historyPointer + 1);
        }
      } else {
        pushHistoryStep(statsMainCtx);
      }
      pushHistoryStep({ mode: 'history', highlightLogId: walletMatch.id, highlightDate: targetDate });

      walletSearchState.active = false;
      resetSearchBarInput('wallet');
      switchTab('history', document.querySelectorAll('.nav-tab')[2], true);
      setTimeout(() => {
        scrollToAndHighlightLog('log-list', walletMatch.id, null, targetDate);
      }, 90);
    }

    // 圖表 1：類別 / 支付方式排行橫向進度條（點擊開啟類紀錄頁明細彈窗）
    let currentRankItems = [];
    function getExpenseKeyForRank(item) {
      if (statsState.rankMode === 'category') {
        return String(item.categoryOrNote || '未分類').split('（')[0] || '未分類';
      }
      return String(item.payment || '未指定').trim() || '未指定';
    }

    function renderStatsRankCard(logs) {
      const listEl = document.getElementById('stats-rank-list');
      const map = {};
      let total = 0;

      logs.forEach(item => {
        if (item.type !== '支出') return;
        const amt = Number(item.amount) || 0;
        const key = getExpenseKeyForRank(item);
        if (!map[key]) map[key] = { name: key, sum: 0, count: 0 };
        map[key].sum += amt;
        map[key].count += 1;
        total += amt;
      });

      const items = Object.values(map).sort((a, b) => b.sum - a.sum);
      currentRankItems = items;

      if (items.length === 0) {
        listEl.innerHTML = '<div class="empty-hint" style="padding:14px 0;">此區間尚無支出項目</div>';
        return;
      }

      listEl.innerHTML = items.map((it, idx) => {
        const pct = total > 0 ? Math.round((it.sum / total) * 100) : 0;
        const barW = total > 0 ? Math.max(3, (it.sum / items[0].sum) * 100) : 0;
        return `
          <div class="rank-row" onclick="selectRankItem(${idx})">
            <div class="rank-top">
              <span class="rank-name">${idx + 1}. ${it.name}</span>
              <span class="rank-val"><b>${it.sum.toLocaleString()} 元</b> (${pct}%)</span>
            </div>
            <div class="rank-track">
              <div class="rank-fill" style="width: ${barW.toFixed(1)}%;"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectRankItem(idx) {
      const it = currentRankItems[idx];
      if (!it) return;
      openStatsDetailModal(it.name, 'date', 'desc');
    }

    function updateStatsDetailSortUI() {
      document.getElementById('stats-sort-date').classList.toggle('active', statsDetailState.sortField === 'date');
      document.getElementById('stats-sort-amt').classList.toggle('active', statsDetailState.sortField === 'amount');
      positionSegSlider(document.getElementById('stats-detail-sort-switch'));
    }

    function openStatsDetailModal(rankName, sortField = 'date', sortDir = 'desc') {
      statsDetailState.open = true;
      statsDetailState.rankName = rankName;
      statsDetailState.sortField = sortField;
      statsDetailState.sortDir = sortDir;
      updateStatsDetailSortUI();
      renderStatsDetailModalList();
      document.getElementById('stats-detail-modal').classList.add('active');
      syncAllStatsSliders();
      const sc = document.getElementById('stats-detail-scroll');
      if (sc) sc.scrollTop = 0;
    }

    function closeStatsDetailModal() {
      statsDetailState.open = false;
      const modal = document.getElementById('stats-detail-modal');
      if (modal) modal.classList.remove('active');
    }

    function setStatsDetailSortField(field) {
      statsDetailState.sortField = field;
      statsDetailState.sortDir = 'desc';
      updateStatsDetailSortUI();
      renderStatsDetailModalList();
      const sc = document.getElementById('stats-detail-scroll');
      if (sc) sc.scrollTop = 0;
    }

    function toggleStatsDetailSortDir() {
      statsDetailState.sortDir = (statsDetailState.sortDir === 'desc') ? 'asc' : 'desc';
      updateStatsDetailSortUI();
      renderStatsDetailModalList();
      const sc = document.getElementById('stats-detail-scroll');
      if (sc) sc.scrollTop = 0;
    }

    function renderStatsDetailModalList() {
      const rankName = statsDetailState.rankName;
      const logs = getFilteredStatsLogs().filter(item =>
        item.type === '支出' && getExpenseKeyForRank(item) === rankName
      );

      const dir = (statsDetailState.sortDir === 'asc') ? 1 : -1;
      if (statsDetailState.sortField === 'amount') {
        logs.sort((a, b) => {
          const diff = ((Number(a.amount) || 0) - (Number(b.amount) || 0)) * dir;
          if (diff !== 0) return diff;
          const dayA = String(a.date || '').split(' ')[0];
          const dayB = String(b.date || '').split(' ')[0];
          if (dayA !== dayB) return dayB.localeCompare(dayA);
          return (Number(b.seq) || 0) - (Number(a.seq) || 0);
        });
      } else {
        logs.sort((a, b) => {
          const dayA = String(a.date || '').split(' ')[0];
          const dayB = String(b.date || '').split(' ')[0];
          if (dayA !== dayB) return dayA.localeCompare(dayB) * dir;
          return ((Number(a.seq) || 0) - (Number(b.seq) || 0)) * dir;
        });
      }

      const totalAmt = logs.reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
      document.getElementById('stats-detail-title').textContent = rankName;
      document.getElementById('stats-detail-total').textContent = `-${totalAmt.toLocaleString()} 元`;
      document.getElementById('stats-detail-count').textContent = `${logs.length} 筆`;

      const listEl = document.getElementById('stats-detail-list');
      listEl.innerHTML = '';

      if (logs.length === 0) {
        listEl.innerHTML = '<div class="empty-hint">目前篩選條件下無對應明細</div>';
        return;
      }

      logs.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-item-wrapper search-result-row';
        const div = buildLogItemContent(item);

        if (statsState.ledger === 'all' && item._ledger) {
          const titleEl = div.querySelector('.log-title');
          if (titleEl) {
            const srcBadge = document.createElement('span');
            srcBadge.className = 'badge-pay';
            srcBadge.textContent = item._ledger;
            titleEl.insertBefore(srcBadge, titleEl.firstChild);
          }
        }

        div.onclick = () => jumpFromStatsDetail(item.id, item._ledger || '錢包');
        wrapper.appendChild(div);
        listEl.appendChild(wrapper);
      });
    }

    function jumpFromStatsDetail(logId, ledgerLabel) {
      if (ledgerLabel === '存錢筒') {
        closeStatsDetailModal();
        openPiggyBankModal();
        const scrollBox = document.getElementById('piggy-scroll-body');
        requestAnimationFrame(() => {
          scrollToAndHighlightLog('piggy-log-list', logId, scrollBox);
        });
        return;
      }

      const sc = document.getElementById('stats-detail-scroll');
      const savedScroll = sc ? sc.scrollTop : 0;
      const detailCtx = {
        mode: 'stats_detail',
        ledger: statsState.ledger,
        range: statsState.range,
        rankMode: statsState.rankMode,
        rankName: statsDetailState.rankName,
        sortField: statsDetailState.sortField,
        sortDir: statsDetailState.sortDir,
        scrollTop: savedScroll
      };

      const curSnap = historyStack[historyPointer];
      if (curSnap && curSnap.viewContext && curSnap.viewContext.mode === 'stats_detail') {
        curSnap.viewContext = detailCtx;
        if (historyPointer < historyStack.length - 1) {
          historyStack = historyStack.slice(0, historyPointer + 1);
        }
      } else {
        pushHistoryStep(detailCtx);
      }

      pushHistoryStep({ mode: 'history', highlightLogId: logId });

      closeStatsDetailModal();
      walletSearchState.active = false;
      switchTab('history', document.querySelectorAll('.nav-tab')[2], true);
      requestAnimationFrame(() => {
        scrollToAndHighlightLog('log-list', logId, null);
      });
    }

    // ========= 分類 & 支付方式 完整管理 =========
    function openOptionModal(type) {
      closeCalcKeyboard();
      currentEditingType = type;
      const isCategory = (type === 'category');
      const sourceList = isCategory ? appState.categories : appState.payments;

      document.getElementById('modal-title-text').textContent = isCategory
        ? '管理選取類別'
        : '管理支付方式';

      document.getElementById('btn-add-row').textContent = isCategory
        ? '＋ 新增一項分類'
        : '＋ 新增一項支付方式';

      tempModalItems = sourceList.map(item => ({
        originalName: item,
        currentName: item
      }));

      renderOptionModalRows();
      document.getElementById('option-modal').classList.add('active');
    }

    function closeOptionModal() {
      document.getElementById('option-modal').classList.remove('active');
    }

    function renderOptionModalRows() {
      const container = document.getElementById('option-edit-list');
      container.innerHTML = '';
      const defaultProtectedName = (currentEditingType === 'category') ? '餐飲' : '現金';

      tempModalItems.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cat-edit-item';
        row.setAttribute('data-drag-idx', String(idx));
        const isDefault = (item.currentName === defaultProtectedName && item.originalName === defaultProtectedName);
        row.innerHTML = `
          <div class="drag-handle" title="按住上下拖曳排序">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="5" y1="8" x2="19" y2="8"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <line x1="5" y1="16" x2="19" y2="16"></line>
            </svg>
          </div>
          <input type="text" class="cat-edit-input" placeholder="請輸入名稱..." value="${item.currentName}" 
            oninput="tempModalItems[${idx}].currentName = this.value">
          <button type="button" class="btn-icon del" onclick="deleteOptionItem(${idx})" ${isDefault ? 'disabled style="opacity:0.35;"' : ''}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        `;
        container.appendChild(row);
        bindRowDragSort(row, container, tempModalItems, renderOptionModalRows);
      });
    }

    function bindRowDragSort(rowEl, containerEl, dataArray, rerenderFn) {
      const handle = rowEl.querySelector('.drag-handle');
      if (!handle) return;

      handle.addEventListener('pointerdown', function(e) {
        if (dataArray.length < 2) return;
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);

        const rows = Array.from(containerEl.querySelectorAll('.cat-edit-item'));
        const dragIdx = rows.indexOf(rowEl);
        if (dragIdx === -1) return;

        const rects = rows.map(r => r.getBoundingClientRect());
        const rowStep = (rects.length > 1)
          ? Math.max(40, rects[1].top - rects[0].top)
          : Math.max(40, rects[0].height + 8);
        const startY = e.clientY;
        let targetIdx = dragIdx;

        const insertLine = document.createElement('div');
        insertLine.className = 'drag-insert-line';
        containerEl.appendChild(insertLine);

        rowEl.classList.add('dragging');
        rowEl.style.transform = 'translateY(0px) scale(1.02)';

        function updateInsertLine(tIdx) {
          const cRect = containerEl.getBoundingClientRect();
          let lineY = 0;
          if (tIdx === 0) {
            lineY = rects[0].top - cRect.top + containerEl.scrollTop - 4;
          } else if (tIdx > dragIdx) {
            lineY = rects[tIdx].bottom - cRect.top + containerEl.scrollTop + 3;
          } else {
            lineY = rects[tIdx].top - cRect.top + containerEl.scrollTop - 5;
          }
          insertLine.style.top = Math.max(0, lineY) + 'px';
        }

        function updateSiblings(tIdx) {
          rows.forEach((r, i) => {
            if (i === dragIdx) return;
            if (tIdx > dragIdx && i > dragIdx && i <= tIdx) {
              r.style.transform = `translateY(-${rowStep}px)`;
            } else if (tIdx < dragIdx && i >= tIdx && i < dragIdx) {
              r.style.transform = `translateY(${rowStep}px)`;
            } else {
              r.style.transform = 'translateY(0px)';
            }
          });
          updateInsertLine(tIdx);
        }

        updateInsertLine(targetIdx);

        function onMove(ev) {
          const dy = ev.clientY - startY;
          rowEl.style.transform = `translateY(${dy}px) scale(1.02)`;

          const draggedCenterY = rects[dragIdx].top + rects[dragIdx].height / 2 + dy;
          let newTarget = dragIdx;
          for (let i = 0; i < rects.length; i++) {
            const mid = rects[i].top + rects[i].height / 2;
            if (i < dragIdx && draggedCenterY < mid) {
              newTarget = i;
              break;
            }
            if (i > dragIdx && draggedCenterY > mid) {
              newTarget = i;
            }
          }
          if (newTarget !== targetIdx) {
            targetIdx = newTarget;
            updateSiblings(targetIdx);
          }
        }

        function onEnd(ev) {
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onEnd);
          handle.removeEventListener('pointercancel', onEnd);
          try { handle.releasePointerCapture(ev.pointerId); } catch (_) {}

          if (insertLine.parentNode) insertLine.parentNode.removeChild(insertLine);
          rowEl.classList.remove('dragging');
          rows.forEach(r => { r.style.transform = ''; });

          if (targetIdx !== dragIdx) {
            const [movedItem] = dataArray.splice(dragIdx, 1);
            dataArray.splice(targetIdx, 0, movedItem);
          }
          rerenderFn();
        }

        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onEnd);
        handle.addEventListener('pointercancel', onEnd);
      });
    }

    function moveOptionItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= tempModalItems.length) return;
      const temp = tempModalItems[index];
      tempModalItems[index] = tempModalItems[target];
      tempModalItems[target] = temp;
      renderOptionModalRows();
    }

    function deleteOptionItem(index) {
      const defaultProtectedName = (currentEditingType === 'category') ? '餐飲' : '現金';
      if (tempModalItems[index].originalName === defaultProtectedName) {
        showAppAlert(`「${defaultProtectedName}」為系統固定預設項目，無法刪除`);
        return;
      }
      tempModalItems.splice(index, 1);
      renderOptionModalRows();
    }

    function addOptionRowInModal() {
      tempModalItems.push({ originalName: null, currentName: '' });
      renderOptionModalRows();
      const list = document.getElementById('option-edit-list');
      list.scrollTop = list.scrollHeight;
    }

    function saveOptionChanges() {
      const hasBlank = tempModalItems.some(item => !(item.currentName || '').trim());
      if (hasBlank) {
        showAppAlert('尚有空白項目未填寫，請輸入名稱或刪除空白列後再儲存。');
        return;
      }

      const finalList = [];
      const renameMap = {};

      for (const item of tempModalItems) {
        const trimmed = (item.currentName || '').trim();
        if (!trimmed) continue;
        if (!finalList.includes(trimmed)) {
          finalList.push(trimmed);
        }
        if (item.originalName && item.originalName !== trimmed) {
          renameMap[item.originalName] = trimmed;
        }
      }

      const isCategory = (currentEditingType === 'category');
      const defaultItem = isCategory ? '餐飲' : '現金';
      if (!finalList.includes(defaultItem)) {
        finalList.unshift(defaultItem);
      }

      if (isCategory) {
        appState.categories = finalList;
      } else {
        appState.payments = finalList;
      }

      if (Object.keys(renameMap).length > 0) {
        const applyRename = (list) => {
          list.forEach(item => {
            if (item.type === '支出') {
              if (isCategory) {
                const oldVal = String(item.categoryOrNote || '');
                if (renameMap[oldVal]) {
                  item.categoryOrNote = renameMap[oldVal];
                } else if (oldVal.includes('（')) {
                  const parts = oldVal.split('（');
                  const baseCat = parts[0];
                  if (renameMap[baseCat]) {
                    item.categoryOrNote = renameMap[baseCat] + '（' + parts.slice(1).join('（');
                  }
                }
              } else {
                const oldPay = String(item.payment || '');
                if (renameMap[oldPay]) {
                  item.payment = renameMap[oldPay];
                }
              }
            }
          });
        };

        applyRename(appState.logs);
        applyRename(appState.piggyLogs);

        if (isCategory) {
          appState.presets.forEach(p => {
            if (renameMap[p.category]) {
              p.category = renameMap[p.category];
            }
          });
        }
      }

      closeOptionModal();
      commitChangeWithVersion();
      renderAll();
    }

    // ========= 常用選項：排序、點入編輯、新增、刪除 =========
    function openPresetManageModal() {
      closeCalcKeyboard();
      tempPresets = (appState.presets || []).map(p => ({
        name: p.name,
        category: p.category,
        amount: p.amount
      }));
      renderPresetManageRows();
      document.getElementById('preset-manage-modal').classList.add('active');
    }

    function closePresetManageModal() {
      document.getElementById('preset-manage-modal').classList.remove('active');
    }

    function renderPresetManageRows() {
      const container = document.getElementById('preset-manage-list');
      container.innerHTML = '';

      if (tempPresets.length === 0) {
        container.innerHTML = '<div class="empty-hint" style="padding:20px 0;">目前沒有常用選項，請點擊下方按鈕新增</div>';
        return;
      }

      tempPresets.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cat-edit-item';
        row.setAttribute('data-drag-idx', String(idx));
        row.innerHTML = `
          <div class="drag-handle" title="按住上下拖曳排序">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="5" y1="8" x2="19" y2="8"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <line x1="5" y1="16" x2="19" y2="16"></line>
            </svg>
          </div>
          <div class="preset-manage-info" onclick="openPresetFormModal(${idx})">
            <div style="display:flex; align-items:baseline; gap:6px;">
              <span style="font-weight:600; font-size:14px; color:var(--text);">${item.name}</span>
              <span style="font-size:12px; color:var(--muted);">${item.category}</span>
            </div>
            <div style="font-weight:600; color:var(--expense); font-variant-numeric:tabular-nums;">${Number(item.amount).toLocaleString()} 元</div>
          </div>
          <button type="button" class="btn-icon del" onclick="deletePresetItem(${idx})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        `;
        container.appendChild(row);
        bindRowDragSort(row, container, tempPresets, renderPresetManageRows);
      });
    }

    function movePresetItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= tempPresets.length) return;
      const temp = tempPresets[index];
      tempPresets[index] = tempPresets[target];
      tempPresets[target] = temp;
      renderPresetManageRows();
    }

    function deletePresetItem(index) {
      tempPresets.splice(index, 1);
      renderPresetManageRows();
    }

    function openPresetFormModal(index) {
      editingPresetIdx = index;
      const catSelect = document.getElementById('preset-select-category');
      catSelect.innerHTML = '';
      appState.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });

      const nameInput = document.getElementById('preset-input-name');
      const amtInput = document.getElementById('preset-input-amount');

      if (index === -1) {
        document.getElementById('preset-form-title').textContent = '新增常用選項';
        nameInput.value = '';
        amtInput.value = '';
        if (appState.categories.includes('餐飲')) {
          catSelect.value = '餐飲';
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
      } else {
        document.getElementById('preset-form-title').textContent = '編輯常用選項';
        const item = tempPresets[index];
        nameInput.value = item.name;
        amtInput.value = item.amount;
        if (appState.categories.includes(item.category)) {
          catSelect.value = item.category;
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
      }

      document.getElementById('preset-form-modal').classList.add('active');
    }

    function closePresetFormModal() {
      document.getElementById('preset-form-modal').classList.remove('active');
    }

    function confirmPresetFormItem() {
      const name = document.getElementById('preset-input-name').value.trim();
      const category = document.getElementById('preset-select-category').value;
      const amount = Math.abs(Number(document.getElementById('preset-input-amount').value) || 0);

      if (!name) {
        showAppAlert('請填寫常用選項名稱');
        return;
      }
      if (!amount || amount <= 0) {
        showAppAlert('請填寫大於 0 的金額');
        return;
      }

      const isDuplicate = tempPresets.some((item, idx) => {
        if (idx === editingPresetIdx) return false;
        return (
          String(item.name).trim() === name &&
          String(item.category).trim() === category &&
          Number(item.amount) === amount
        );
      });

      if (isDuplicate) {
        showAppAlert(`已存在完全相同的常用選項：\n「${name}（${category}・${amount.toLocaleString()} 元）」\n請勿重複新增！`);
        return;
      }

      const newObj = { name, category, amount };
      if (editingPresetIdx === -1) {
        tempPresets.push(newObj);
      } else {
        tempPresets[editingPresetIdx] = newObj;
      }

      closePresetFormModal();
      renderPresetManageRows();
    }

    function savePresetListChanges() {
      appState.presets = tempPresets.map(item => ({
        name: String(item.name || '').trim(),
        category: String(item.category || '餐飲').trim(),
        amount: Math.abs(Number(item.amount) || 0)
      }));
      selectedPresetIndex = null;
      closePresetManageModal();
      commitChangeWithVersion();
      renderAll();
    }

    // 全域即時觸控阻尼回饋（確保 iOS Safari 快速輕點也能呈現縮放回彈手感）
    (function initGlobalTouchFeedback() {
      const selector = 'button, .today-spend-row, .piggy-bank-btn, .preset-chip, .rank-row, .stats-kpi-card.clickable, .stats-detail-box.clickable, .date-picker-bar, .preset-manage-info, .amount-input-wrapper, .swipe-item-wrapper.search-result-row .log-item';
      let activeEl = null;
      let pressStart = 0;

      function releaseEl() {
        if (!activeEl) return;
        const el = activeEl;
        activeEl = null;
        const elapsed = Date.now() - pressStart;
        const delay = Math.max(0, 140 - elapsed);
        setTimeout(() => el.classList.remove('is-pressed'), delay);
      }

      document.addEventListener('pointerdown', function(e) {
        const target = e.target && e.target.closest ? e.target.closest(selector) : null;
        if (!target || target.disabled) return;
        if (activeEl && activeEl !== target) activeEl.classList.remove('is-pressed');
        activeEl = target;
        pressStart = Date.now();
        target.classList.add('is-pressed');
      }, { passive: true });

      document.addEventListener('pointerup', releaseEl, { passive: true });
      document.addEventListener('pointercancel', releaseEl, { passive: true });
    })();
  </script>
</body>
