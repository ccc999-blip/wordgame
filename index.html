    function parseExpenseDisplay(item) {
      let rawCat = String(item.categoryOrNote || '');
      let baseCat = rawCat;
      let presetNote = '';

      const match = rawCat.match(/^(.+?)（(.+)）$/);
      if (match) {
        baseCat = match[1];
        presetNote = match[2];
      }

      let extraMemo = String(item.memo || '').trim();
      let combinedNote = '';
      if (presetNote && extraMemo && presetNote !== extraMemo) {
        combinedNote = `${presetNote}・${extraMemo}`;
      } else {
        combinedNote = presetNote || extraMemo;
      }

      return { baseCat, combinedNote };
    }

    // ========= 紀錄頁左滑刪除手勢綁定 =========
    let currentOpenSwipeWrapper = null;

    function closeAnyOpenSwipeItem(exceptWrapper) {
      if (currentOpenSwipeWrapper && currentOpenSwipeWrapper !== exceptWrapper) {
        const fg = currentOpenSwipeWrapper.querySelector('.log-item');
        if (fg) fg.style.transform = 'translateX(0px)';
        currentOpenSwipeWrapper.classList.remove('open', 'swiping');
        currentOpenSwipeWrapper = null;
      }
    }

    function attachSwipeHandler(wrapper, fgEl, logId) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let baseOffset = 0;
      let isDragging = false;
      let isHorizontal = null;

      fgEl.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        closeAnyOpenSwipeItem(wrapper);
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        baseOffset = wrapper.classList.contains('open') ? -78 : 0;
        currentX = baseOffset;
        isDragging = true;
        isHorizontal = null;
        fgEl.style.transition = 'none';
      }, { passive: true });

      fgEl.addEventListener('touchmove', function(e) {
        if (!isDragging || !e.touches || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (isHorizontal === null) {
          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
            isHorizontal = Math.abs(dx) > Math.abs(dy);
          }
        }
        if (!isHorizontal) return;

        if (e.cancelable) e.preventDefault();
        wrapper.classList.add('swiping');
        currentX = Math.min(0, baseOffset + dx);
        fgEl.style.transform = `translateX(${currentX}px)`;
      }, { passive: false });

      fgEl.addEventListener('touchend', function() {
        if (!isDragging) return;
        isDragging = false;
        fgEl.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
        const fullWidth = wrapper.offsetWidth || 320;

        if (currentX < -fullWidth * 0.45) {
          fgEl.style.transform = `translateX(-${fullWidth}px)`;
          setTimeout(() => {
            deleteLogById(logId);
          }, 160);
        } else if (currentX < -38) {
          fgEl.style.transform = 'translateX(-78px)';
          wrapper.classList.add('open');
          wrapper.classList.remove('swiping');
          currentOpenSwipeWrapper = wrapper;
        } else {
          fgEl.style.transform = 'translateX(0px)';
          wrapper.classList.remove('open', 'swiping');
          if (currentOpenSwipeWrapper === wrapper) currentOpenSwipeWrapper = null;
        }
      });
    }

    // ========= 渲染紀錄頁 =========
    function renderHistory() {
      const listEl = document.getElementById('log-list');
      listEl.innerHTML = '';
      currentOpenSwipeWrapper = null;

      const logs = appState.logs || [];
      if (logs.length === 0) {
        listEl.innerHTML = '<div class="empty-hint">尚無任何歷史紀錄</div>';
        return;
      }

      const todayKey = getTodayDateKey();

      const blocks = [];
      let currentBlock = null;

      logs.forEach(item => {
        if (item.type === '清空') {
          if (currentBlock) {
            blocks.push(currentBlock);
            currentBlock = null;
          }
          blocks.push({ isClear: true, item: item });
          return;
        }

        const dayKey = String(item.date || '').split(' ')[0] || '';
        if (!currentBlock || currentBlock.dayKey !== dayKey) {
          if (currentBlock) blocks.push(currentBlock);
          currentBlock = {
            isClear: false,
            dayKey: dayKey,
            expenseSum: 0,
            items: []
          };
        }
        if (item.type === '支出') {
          currentBlock.expenseSum += Number(item.amount) || 0;
        }
        currentBlock.items.push(item);
      });
      if (currentBlock) blocks.push(currentBlock);

      let lastAppendedWrapper = null;

      blocks.forEach(block => {
        if (block.isClear) {
          if (lastAppendedWrapper) {
            lastAppendedWrapper.classList.add('no-bottom-border');
          }
          const wrapper = document.createElement('div');
          wrapper.className = 'swipe-item-wrapper clear-wrapper';

          const delBg = document.createElement('div');
          delBg.className = 'swipe-delete-bg';
          delBg.textContent = '刪除';
          delBg.onclick = () => deleteLogById(block.item.id);

          const div = document.createElement('div');
          div.className = 'log-item clear-event';
          div.innerHTML = `
            <span style="font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.5px;">預算週期重置（歸零）</span>
            <span class="log-date">${formatDateWithWeekday(block.item.date)}</span>
          `;

          wrapper.appendChild(delBg);
          wrapper.appendChild(div);
          attachSwipeHandler(wrapper, div, block.item.id);
          listEl.appendChild(wrapper);
          lastAppendedWrapper = null;
          return;
        }

        const isDayFinished = (block.dayKey && block.dayKey < todayKey);
        if (isDayFinished) {
          if (lastAppendedWrapper) {
            lastAppendedWrapper.classList.add('no-bottom-border');
          }
          const divider = document.createElement('div');
          divider.className = 'day-summary-divider';
          divider.innerHTML = `
            <div class="day-summary-line"></div>
            <div class="day-summary-pill">
              ${formatDayOnlyWithWeekday(block.dayKey)} 支出 <b>${block.expenseSum.toLocaleString()} 元</b>
            </div>
            <div class="day-summary-line"></div>
          `;
          listEl.appendChild(divider);
        }

        block.items.forEach(item => {
          const formattedFullDate = formatDateWithWeekday(item.date);
          const wrapper = document.createElement('div');
          wrapper.className = 'swipe-item-wrapper';

          const delBg = document.createElement('div');
          delBg.className = 'swipe-delete-bg';
          delBg.textContent = '刪除';
          delBg.onclick = () => deleteLogById(item.id);

          const div = document.createElement('div');
          div.className = 'log-item';

          if (item.type === '收入') {
            div.innerHTML = `
              <div class="log-left">
                <div class="log-title" style="color:var(--income);">
                  <span>${item.categoryOrNote || '收入'}</span>
                </div>
                <div class="log-date">${formattedFullDate}</div>
              </div>
              <div class="log-right">
                <div class="log-amt income">+${item.amount.toLocaleString()} 元</div>
                <div class="log-rem">餘額 ${item.remaining.toLocaleString()} 元</div>
              </div>
            `;
          } else {
            const { baseCat, combinedNote } = parseExpenseDisplay(item);
            const noteSpanHtml = combinedNote
              ? `<span class="log-note-inline">${combinedNote}</span>`
              : '';

            div.innerHTML = `
              <div class="log-left">
                <div class="log-title">
                  <span class="log-cat-name">${baseCat}</span>
                  <span class="badge-pay">${item.payment}</span>
                  ${noteSpanHtml}
                </div>
                <div class="log-date">${formattedFullDate}</div>
              </div>
              <div class="log-right">
                <div class="log-amt expense">-${item.amount.toLocaleString()} 元</div>
                <div class="log-rem">餘額 ${item.remaining.toLocaleString()} 元</div>
              </div>
            `;
          }

          wrapper.appendChild(delBg);
          wrapper.appendChild(div);
          attachSwipeHandler(wrapper, div, item.id);
          listEl.appendChild(wrapper);
          lastAppendedWrapper = wrapper;
        });
      });
    }

    // ========= 分類 & 支付方式 完整管理 =========
    function openOptionModal(type) {

    function closeOptionModal() {
      document.getElementById('option-modal').classList.remove('active');
    }

    function renderOptionModalRows() {
      const container = document.getElementById('option-edit-list');
      container.innerHTML = '';
      const defaultProtectedName = (currentEditingType === 'category') ? '餐飲' : '現金';

      tempModalItems.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cat-edit-item';
        const isDefault = (item.currentName === defaultProtectedName && item.originalName === defaultProtectedName);
        row.innerHTML = `
          <input type="text" class="cat-edit-input" value="${item.currentName}" 
            oninput="tempModalItems[${idx}].currentName = this.value">
          <button type="button" class="btn-icon" onclick="moveOptionItem(${idx}, -1)">↑</button>
          <button type="button" class="btn-icon" onclick="moveOptionItem(${idx}, 1)">↓</button>
          <button type="button" class="btn-icon del" onclick="deleteOptionItem(${idx})" ${isDefault ? 'disabled style="opacity:0.35;"' : ''}>刪</button>
        `;
        container.appendChild(row);
      });
    }

    function moveOptionItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= tempModalItems.length) return;
      const temp = tempModalItems[index];
      tempModalItems[index] = tempModalItems[target];
      tempModalItems[target] = temp;
      renderOptionModalRows();
    }

    function deleteOptionItem(index) {
      const defaultProtectedName = (currentEditingType === 'category') ? '餐飲' : '現金';
      if (tempModalItems[index].originalName === defaultProtectedName) {
        showAppAlert(`「${defaultProtectedName}」為系統固定預設項目，無法刪除`);
        return;
      }
      tempModalItems.splice(index, 1);
      renderOptionModalRows();
    }

    function addOptionRowInModal() {
      tempModalItems.push({ originalName: null, currentName: '' });
      renderOptionModalRows();
      const list = document.getElementById('option-edit-list');
      list.scrollTop = list.scrollHeight;
    }

    function saveOptionChanges() {
      const finalList = [];
      const renameMap = {};

      for (const item of tempModalItems) {
        const trimmed = (item.currentName || '').trim();
        if (!trimmed) continue;
        if (!finalList.includes(trimmed)) {
          finalList.push(trimmed);
        }
        if (item.originalName && item.originalName !== trimmed) {
          renameMap[item.originalName] = trimmed;
        }
      }

      const isCategory = (currentEditingType === 'category');
      const defaultItem = isCategory ? '餐飲' : '現金';
      if (!finalList.includes(defaultItem)) {
        finalList.unshift(defaultItem);
      }

      if (isCategory) {
        appState.categories = finalList;
      } else {
        appState.payments = finalList;
      }

      if (Object.keys(renameMap).length > 0) {
        appState.logs.forEach(item => {
          if (item.type === '支出') {
            if (isCategory) {
              const oldVal = String(item.categoryOrNote || '');
              if (renameMap[oldVal]) {
                item.categoryOrNote = renameMap[oldVal];
              } else if (oldVal.includes('（')) {
                const parts = oldVal.split('（');
                const baseCat = parts[0];
                if (renameMap[baseCat]) {
                  item.categoryOrNote = renameMap[baseCat] + '（' + parts.slice(1).join('（');
                }
              }
            } else {
              const oldPay = String(item.payment || '');
              if (renameMap[oldPay]) {
                item.payment = renameMap[oldPay];
              }
            }
          }
        });

        if (isCategory) {
          appState.presets.forEach(p => {
            if (renameMap[p.category]) {
              p.category = renameMap[p.category];
            }
          });
        }
      }

      closeOptionModal();
      commitChangeWithVersion();
      renderAll();
    }

    // ========= 常用選項：排序、點入編輯、新增、刪除 =========
    function openPresetManageModal() {
      closeCalcKeyboard();
      tempPresets = (appState.presets || []).map(p => ({
        name: p.name,
        category: p.category,
        amount: p.amount
      }));
      renderPresetManageRows();
      document.getElementById('preset-manage-modal').classList.add('active');
    }

    function closePresetManageModal() {
      document.getElementById('preset-manage-modal').classList.remove('active');
    }

    function renderPresetManageRows() {
      const container = document.getElementById('preset-manage-list');
      container.innerHTML = '';

      if (tempPresets.length === 0) {
        container.innerHTML = '<div class="empty-hint" style="padding:20px 0;">目前沒有常用選項，請點擊下方按鈕新增</div>';
        return;
      }

      tempPresets.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cat-edit-item';
        row.innerHTML = `
          <div class="preset-manage-info" onclick="openPresetFormModal(${idx})">
            <div style="display:flex; align-items:baseline; gap:6px;">
              <span style="font-weight:600; font-size:14px; color:var(--text);">${item.name}</span>
              <span style="font-size:12px; color:var(--muted);">${item.category}</span>
            </div>
            <div style="font-weight:600; color:var(--expense); font-variant-numeric:tabular-nums;">${Number(item.amount).toLocaleString()} 元</div>
          </div>
          <button type="button" class="btn-icon" onclick="movePresetItem(${idx}, -1)">↑</button>
          <button type="button" class="btn-icon" onclick="movePresetItem(${idx}, 1)">↓</button>
          <button type="button" class="btn-icon del" onclick="deletePresetItem(${idx})">刪</button>
        `;
        container.appendChild(row);
      });
    }

    function movePresetItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= tempPresets.length) return;
      const temp = tempPresets[index];
      tempPresets[index] = tempPresets[target];
      tempPresets[target] = temp;
      renderPresetManageRows();
    }

    function deletePresetItem(index) {
      tempPresets.splice(index, 1);
      renderPresetManageRows();
    }

    function openPresetFormModal(index) {
      editingPresetIdx = index;
      const catSelect = document.getElementById('preset-select-category');
      catSelect.innerHTML = '';
      appState.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });

      const nameInput = document.getElementById('preset-input-name');
      const amtInput = document.getElementById('preset-input-amount');

      if (index === -1) {
        document.getElementById('preset-form-title').textContent = '新增常用選項';
        nameInput.value = '';
        amtInput.value = '';
        if (appState.categories.includes('餐飲')) {
          catSelect.value = '餐飲';
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
      } else {
        document.getElementById('preset-form-title').textContent = '編輯常用選項';
        const item = tempPresets[index];
        nameInput.value = item.name;
        amtInput.value = item.amount;
        if (appState.categories.includes(item.category)) {
          catSelect.value = item.category;
        } else if (catSelect.options.length > 0) {
          catSelect.selectedIndex = 0;
        }
      }

      document.getElementById('preset-form-modal').classList.add('active');
    }

    function closePresetFormModal() {
      document.getElementById('preset-form-modal').classList.remove('active');
    }

    function confirmPresetFormItem() {
      const name = document.getElementById('preset-input-name').value.trim();
      const category = document.getElementById('preset-select-category').value;
      const amount = Math.abs(Number(document.getElementById('preset-input-amount').value) || 0);

      if (!name) {
        showAppAlert('請填寫常用選項名稱');
        return;
      }
      if (!amount || amount <= 0) {
        showAppAlert('請填寫大於 0 的金額');
        return;
      }

      const isDuplicate = tempPresets.some((item, idx) => {
        if (idx === editingPresetIdx) return false;
        return (
          String(item.name).trim() === name &&
          String(item.category).trim() === category &&
          Number(item.amount) === amount
        );
      });

      if (isDuplicate) {
        showAppAlert(`已存在完全相同的常用選項：\n「${name}（${category}・${amount.toLocaleString()} 元）」\n請勿重複新增！`);
        return;
      }

      const newObj = { name, category, amount };
      if (editingPresetIdx === -1) {
        tempPresets.push(newObj);
      } else {
        tempPresets[editingPresetIdx] = newObj;
      }

      closePresetFormModal();
      renderPresetManageRows();
    }

    function savePresetListChanges() {
      appState.presets = tempPresets.map(item => ({
        name: String(item.name || '').trim(),
        category: String(item.category || '餐飲').trim(),
        amount: Math.abs(Number(item.amount) || 0)
      }));
      selectedPresetIndex = null;
      closePresetManageModal();
      commitChangeWithVersion();
      renderAll();
    }
  </script>
</body>
</html>
